<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICONIC — Icon Library</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Icon class definitions (size/animation/transform utilities + .icon-*::after rules) -->
    <link rel="stylesheet" href="iconic.css">

    <style>
        :root {
            --bg-deep: #F8F8F8;
            --bg: #F8F8F8;
            --bg-surface: #F1F1F4;
            --bg-card: #F8F8F8;
            --bg-hover: #ECECF0;
            --fg: #1a1a22;
            --fg-sec: #5c5c66;
            --fg-muted: #a0a0aa;
            --accent: #f97316;
            --accent-h: #ea580c;
            --accent-soft: rgba(249, 115, 22, .07);
            --accent-glow: rgba(249, 115, 22, .2);
            --success: #22c55e;
            --border: #e6e6ec;
            --border-h: #d8d8e0;
            --radius: 10px;
            --radius-sm: 7px;
            --tr: .2s cubic-bezier(.4, 0, .2, 1);
            --sidebar-w: 230px;
            --navbar-h: 60px;
            --footer-h: 44px;
            --panel-w: 380px;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scrollbar-width: thin;
            scrollbar-color: var(--border-h) transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            background: var(--bg);
            color: var(--fg);
            line-height: 1.5;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== Navbar ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--navbar-h);
            background: var(--bg-deep);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 16px;
            z-index: 100;
        }

        .navbar::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-glow), transparent);
            pointer-events: none;
        }

        .nav-logo { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

        .nav-logo-box {
            width: 34px; height: 34px;
            background: linear-gradient(135deg, var(--accent), #fb923c);
            border-radius: 9px;
            display: flex; align-items: center; justify-content: center;
        }
        .nav-logo-box svg { width: 18px; height: 18px; color: #fff; }

        .nav-logo-text { font-size: 1.15rem; font-weight: 800; letter-spacing: -.03em; color: var(--fg); }
        .nav-logo-text span { color: var(--accent); }

        .nav-search { flex: 1; max-width: 480px; position: relative; }
        .nav-search input {
            width: 100%;
            padding: 9px 14px 9px 38px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--fg);
            font-family: inherit;
            font-size: .875rem;
            outline: none;
            transition: all var(--tr);
        }
        .nav-search input::placeholder { color: var(--fg-muted); }
        .nav-search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
        .nav-search svg {
            position: absolute; left: 12px; top: 50%;
            transform: translateY(-50%);
            width: 16px; height: 16px;
            color: var(--fg-muted); pointer-events: none;
        }

        .nav-badge {
            background: var(--accent-soft);
            color: var(--accent);
            font-size: .75rem; font-weight: 600;
            padding: 4px 12px; border-radius: 20px;
            border: 1px solid rgba(249, 115, 22, .15);
            white-space: nowrap;
            font-family: 'JetBrains Mono', monospace;
        }

        .nav-ver { font-size: .7rem; color: var(--fg-muted); margin-left: auto; flex-shrink: 0; }

        /* ===== Layout ===== */
        .layout {
            display: flex;
            flex: 1;
            min-height: 0;
            padding-top: var(--navbar-h);
            padding-bottom: var(--footer-h);
        }

        .sidebar {
            width: var(--sidebar-w);
            flex-shrink: 0;
            background: var(--bg-deep);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 16px 0;
            scrollbar-width: thin;
            scrollbar-color: var(--border-h) transparent;
        }

        .sidebar-label {
            font-size: .65rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: .1em;
            color: var(--fg-muted);
            padding: 12px 20px 8px;
        }

        .sb-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 20px; cursor: pointer;
            transition: all var(--tr);
            border-left: 3px solid transparent;
            color: var(--fg-sec); font-size: .85rem; font-weight: 500;
        }
        .sb-item:hover { background: var(--bg-surface); color: var(--fg); }
        .sb-item.active { background: var(--accent-soft); color: var(--accent); border-left-color: var(--accent); }

        .sb-count {
            font-size: .7rem; font-family: 'JetBrains Mono', monospace;
            color: var(--fg-muted); background: var(--bg-surface);
            padding: 1px 7px; border-radius: 10px;
        }
        .sb-item.active .sb-count { background: rgba(249, 115, 22, .12); color: var(--accent); }

        .main {
            flex: 1; overflow-y: auto;
            padding: 24px;
            scroll-behavior: smooth;
        }

        .main-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .main-title { font-size: 1.1rem; font-weight: 600; }
        .main-title b { color: var(--accent); font-family: 'JetBrains Mono', monospace; font-weight: 700; }

        /* ===== Icon grid ===== */
        .ic-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
            gap: 8px;
            margin-bottom: 48px;
        }

        .ic-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 8px 12px;
            display: flex; flex-direction: column;
            align-items: center; gap: 10px;
            cursor: pointer;
            transition: all var(--tr);
            position: relative;
            content-visibility: auto;
            contain-intrinsic-size: 0 90px;
        }
        .ic-card::before {
            content: ''; position: absolute; inset: 0;
            border-radius: inherit;
            background: radial-gradient(circle at 50% 30%, var(--accent-soft), transparent 70%);
            opacity: 0; transition: opacity var(--tr); pointer-events: none;
        }
        .ic-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0, 0, 0, .08); }
        .ic-card:hover::before { opacity: 1; }
        .ic-card:active { transform: scale(.96); }
        .ic-card.selected { border-color: var(--accent); background: var(--accent-soft); }

        .ic-card icon-ic { font-size: 1.6rem; color: var(--fg-sec); transition: color var(--tr); line-height: 1; }
        .ic-card:hover icon-ic { color: var(--fg); }

        .ic-name {
            font-size: .58rem; font-family: 'JetBrains Mono', monospace;
            color: var(--fg-muted); text-align: center; line-height: 1.25;
            word-break: break-all; max-height: 2.5em; overflow: hidden;
            transition: color var(--tr);
        }
        .ic-card:hover .ic-name { color: var(--fg-sec); }

        .empty { grid-column: 1 / -1; text-align: center; padding: 80px 20px; color: var(--fg-muted); }
        .empty svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: .3; }
        .empty h3 { font-size: 1rem; color: var(--fg-sec); font-weight: 500; margin-bottom: 4px; }

        /* ===== Overlay + Slide Panel ===== */
        .overlay {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, .5);
            z-index: 200; opacity: 0; pointer-events: none;
            transition: opacity .3s ease;
        }
        .overlay.show { opacity: 1; pointer-events: auto; }

        .panel {
            position: fixed; top: 0; right: 0; bottom: 0;
            width: var(--panel-w);
            background: var(--bg-deep);
            border-left: 1px solid var(--border);
            z-index: 201;
            transform: translateX(100%);
            transition: transform .35s cubic-bezier(.4, 0, .2, 1);
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--border-h) transparent;
        }
        .panel.show { transform: translateX(0); }

        .pn-close {
            position: absolute; top: 16px; right: 16px;
            width: 32px; height: 32px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--fg-muted);
            transition: all var(--tr); z-index: 5;
        }
        .pn-close:hover { background: var(--bg-hover); color: var(--fg); border-color: var(--border-h); }
        .pn-close svg { width: 16px; height: 16px; }

        .pn-body { padding: 28px 24px 40px; }

        .pn-preview {
            display: flex; align-items: center; justify-content: center;
            height: 120px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 20px;
        }
        .pn-preview icon-ic { font-size: 4rem; line-height: 1; color: var(--fg); }

        .pn-name {
            font-size: 1.15rem; font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            margin-bottom: 24px; color: var(--fg);
            word-break: break-all;
        }

        .pn-section { margin-bottom: 24px; }
        .pn-label {
            font-size: .7rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: .08em;
            color: var(--fg-muted); margin-bottom: 10px;
        }

        .pn-code {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            overflow: hidden;
        }
        .pn-code-head {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 14px;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
        }
        .pn-code-lang { font-size: .68rem; color: var(--fg-muted); font-family: 'JetBrains Mono', monospace; }
        .pn-copy {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--fg-muted);
            padding: 3px 10px; border-radius: 5px;
            font-family: inherit; font-size: .68rem;
            cursor: pointer; transition: all var(--tr);
        }
        .pn-copy:hover { border-color: var(--accent); color: var(--accent); }

        .pn-code pre {
            padding: 14px;
            font-family: 'JetBrains Mono', monospace;
            font-size: .78rem; line-height: 1.7;
            color: var(--fg-sec);
            overflow-x: auto; white-space: pre; margin: 0;
        }
        .pn-code pre .t { color: #ea580c; }
        .pn-code pre .a { color: #d97706; }
        .pn-code pre .s { color: #16a34a; }
        .pn-code pre .c { color: #9ca3af; font-style: italic; }

        .pn-demo-row {
            display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
            padding: 14px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
        }
        .pn-demo-item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .pn-demo-item icon-ic { line-height: 1; color: var(--fg); }
        .pn-demo-tag {
            font-size: .58rem; font-family: 'JetBrains Mono', monospace;
            color: var(--fg-muted); background: var(--bg);
            padding: 2px 6px; border-radius: 4px;
            border: 1px solid var(--border);
        }

        /* ===== Footer (sticky bottom) ===== */
        .footer {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: var(--footer-h);
            background: var(--bg-deep);
            border-top: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px;
            z-index: 90;
            font-size: .75rem;
            color: var(--fg-muted);
        }
        .footer .ft-left { display: flex; align-items: center; gap: 8px; }
        .footer .ft-left strong { color: var(--fg); font-weight: 700; letter-spacing: -.02em; }
        .footer .ft-left strong span { color: var(--accent); }
        .footer .ft-right { display: flex; align-items: center; gap: 14px; font-family: 'JetBrains Mono', monospace; }
        .footer .ft-right a { color: var(--fg-muted); text-decoration: none; transition: color var(--tr); }
        .footer .ft-right a:hover { color: var(--accent); }
        .footer .ft-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); display: inline-block; }

        /* ===== Toast ===== */
        .toast-wrap {
            position: fixed; bottom: calc(var(--footer-h) + 24px);
            left: 50%; transform: translateX(-50%);
            z-index: 9999;
            display: flex; flex-direction: column; gap: 8px; align-items: center;
            pointer-events: none;
        }
        .toast-msg {
            background: var(--bg-card);
            border: 1px solid var(--success);
            color: var(--success);
            padding: 10px 20px; border-radius: var(--radius-sm);
            font-size: .82rem; font-weight: 500;
            box-shadow: 0 8px 32px rgba(0, 0, 0, .15);
            animation: toastIn .3s ease, toastOut .3s ease 1.5s forwards;
            pointer-events: auto; white-space: nowrap;
        }
        @keyframes toastIn { from { opacity: 0; transform: translateY(12px) scale(.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes toastOut { to { opacity: 0; transform: translateY(-8px) scale(.95); } }

        /* ===== Responsive ===== */
        @media (max-width: 900px) {
            :root { --sidebar-w: 0px; --panel-w: 100vw; }
            .sidebar { display: none; }
            .nav-ver { display: none; }
        }
        @media (max-width: 600px) {
            .ic-grid { grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); gap: 6px; }
            .ic-card { padding: 12px 6px 10px; }
            .ic-card icon-ic { font-size: 1.3rem; }
            .ic-name { font-size: .52rem; }
            .main { padding: 16px 12px; }
            .footer .ft-right { display: none; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
        }
    </style>
</head>

    function renderGrid(filter, cat) {
        icGrid.innerHTML = '';
        var fl = filter ? filter.toLowerCase() : '';
        var count = 0;
        var frag = document.createDocumentFragment();

        for (var i = 0; i < iconNames.length; i++) {
            var name = iconNames[i];
            var ms = !fl || name.indexOf(fl) !== -1;
            var mc = cat === 'All' || categorize(name) === cat;
            if (!ms || !mc) continue;
            count++;

            var card = document.createElement('div');
            card.className = 'ic-card';
            card.dataset.name = name;
            if (name === selectedIcon) card.classList.add('selected');
            card.innerHTML = '<icon-ic class="icon-' + name + '"></icon-ic><span class="ic-name">icon-' + name + '</span>';
            card.addEventListener('click', (function (nm) {
                return function () { openPanel(nm); };
            })(name));
            frag.appendChild(card);
        }

        if (count === 0) {
            var empty = document.createElement('div');
            empty.className = 'empty';
            empty.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><h3>No icons found</h3><p>Try a different search or category</p>';
            frag.appendChild(empty);
        }

        icGrid.appendChild(frag);
        countInline.textContent = count;
        var catLabel = cat === 'All' ? 'All Icons' : cat;
        mainTitle.innerHTML = catLabel + ' <b>' + count + '</b>';
    }

    renderGrid('', activeCat);

    // ===== Sidebar click =====
    sidebarList.addEventListener('click', function (e) {
        var item = e.target.closest('.sb-item');
        if (!item) return;
        activeCat = item.dataset.cat;
        var items = sidebarList.querySelectorAll('.sb-item');
        for (var i = 0; i < items.length; i++) items[i].classList.remove('active');
        item.classList.add('active');
        renderGrid(searchInput.value.trim(), activeCat);
    });

    // ===== Search =====
    searchInput.addEventListener('input', function () {
        renderGrid(searchInput.value.trim(), activeCat);
    });

    // ===== Detail Panel =====
    function openPanel(name) {
        selectedIcon = name;
        var cards = icGrid.querySelectorAll('.ic-card');
        for (var i = 0; i < cards.length; i++) {
            if (cards[i].dataset.name === name) cards[i].classList.add('selected');
            else cards[i].classList.remove('selected');
        }

        panelBody.innerHTML =
            '<div class="pn-preview"><icon-ic class="icon-' + name + '"></icon-ic></div>' +
            '<div class="pn-name">icon-' + name + '</div>' +
            '<div class="pn-section"><div class="pn-label">Usage</div><div class="pn-code"><div class="pn-code-head"><span class="pn-code-lang">HTML</span><button class="pn-copy" data-text=\'<icon-ic class="icon-' + name + '"></icon-ic>\'>Copy</button></div><pre><span class="t">&lt;icon-ic</span> <span class="a">class</span>=<span class="s">"icon-' + name + '"</span><span class="t">&gt;&lt;/icon-ic&gt;</span></pre></div></div>' +
            '<div class="pn-section"><div class="pn-label">CDN</div><div class="pn-code"><div class="pn-code-head"><span class="pn-code-lang">HTML</span><button class="pn-copy" data-text=\'&lt;link rel=&quot;stylesheet&quot; href=&quot;https://cdn.jsdelivr.net/gh/junaidprodeveloper/Iconic@1.0.0.1/iconic.css&quot;&gt;\'>Copy</button></div><pre><span class="c">&lt;!-- Add to &lt;head&gt; --&gt;</span>\n<span class="t">&lt;link</span> <span class="a">rel</span>=<span class="s">"stylesheet"</span> <span class="a">href</span>=<span class="s">"https://your-cdn.com/iconic/iconic.css"</span><span class="t">&gt;</span></pre></div></div>' +
            '<div class="pn-section"><div class="pn-label">Sizes</div><div class="pn-demo-row">' +
            '<div class="pn-demo-item"><icon-ic class="icon-' + name + ' icon-xs"></icon-ic><span class="pn-demo-tag">xs</span></div>' +
            '<div class="pn-demo-item"><icon-ic class="icon-' + name + ' icon-sm"></icon-ic><span class="pn-demo-tag">sm</span></div>' +
            '<div class="pn-demo-item"><icon-ic class="icon-' + name + ' icon-md"></icon-ic><span class="pn-demo-tag">md</span></div>' +
            '<div class="pn-demo-item"><icon-ic class="icon-' + name + ' icon-lg"></icon-ic><span class="pn-demo-tag">lg</span></div>' +
            '<div class="pn-demo-item"><icon-ic class="icon-' + name + ' icon-xl"></icon-ic><span class="pn-demo-tag">xl</span></div>' +
            '<div class="pn-demo-item"><icon-ic class="icon-' + name + ' icon-2x"></icon-ic><span class="pn-demo-tag">2x</span></div>' +
            '<div class="pn-demo-item"><icon-ic class="icon-' + name + ' icon-3x"></icon-ic><span class="pn-demo-tag">3x</span></div>' +
            '</div></div>' +
            '<div class="pn-section"><div class="pn-label">Animations</div><div class="pn-demo-row">' +
            '<div class="pn-demo-item"><icon-ic class="icon-' + name + ' icon-spin" style="font-size:1.4rem"></icon-ic><span class="pn-demo-tag">spin</span></div>' +
            '<div class="pn-demo-item"><icon-ic class="icon-' + name + ' icon-pulse" style="font-size:1.4rem"></icon-ic><span class="pn-demo-tag">pulse</span></div>' +
            '<div class="pn-demo-item"><icon-ic class="icon-' + name + ' icon-bounce" style="font-size:1.4rem"></icon-ic><span class="pn-demo-tag">bounce</span></div>' +
            '<div class="pn-demo-item"><icon-ic class="icon-' + name + ' icon-beat" style="font-size:1.4rem"></icon-ic><span class="pn-demo-tag">beat</span></div>' +
            '<div class="pn-demo-item"><icon-ic class="icon-' + name + ' icon-fade" style="font-size:1.4rem"></icon-ic><span class="pn-demo-tag">fade</span></div>' +
            '<div class="pn-demo-item"><icon-ic class="icon-' + name + ' icon-shake" style="font-size:1.4rem"></icon-ic><span class="pn-demo-tag">shake</span></div>' +
            '</div></div>' +
            '<div class="pn-section"><div class="pn-label">Transforms</div><div class="pn-demo-row">' +
            '<div class="pn-demo-item"><icon-ic class="icon-' + name + ' icon-rotate-90" style="font-size:1.4rem"></icon-ic><span class="pn-demo-tag">90</span></div>' +
            '<div class="pn-demo-item"><icon-ic class="icon-' + name + ' icon-rotate-180" style="font-size:1.4rem"></icon-ic><span class="pn-demo-tag">180</span></div>' +
            '<div class="pn-demo-item"><icon-ic class="icon-' + name + ' icon-rotate-270" style="font-size:1.4rem"></icon-ic><span class="pn-demo-tag">270</span></div>' +
            '<div class="pn-demo-item"><icon-ic class="icon-' + name + ' icon-flip-horizontal" style="font-size:1.4rem"></icon-ic><span class="pn-demo-tag">flipH</span></div>' +
            '<div class="pn-demo-item"><icon-ic class="icon-' + name + ' icon-flip-vertical" style="font-size:1.4rem"></icon-ic><span class="pn-demo-tag">flipV</span></div>' +
            '<div class="pn-demo-item"><icon-ic class="icon-' + name + ' icon-flip-both" style="font-size:1.4rem"></icon-ic><span class="pn-demo-tag">flipB</span></div>' +
            '</div></div>';

        // Wire copy buttons inside panel
        var btns = panelBody.querySelectorAll('.pn-copy');
        for (var i = 0; i < btns.length; i++) {
            btns[i].addEventListener('click', function () {
                var txt = this.dataset.text;
                var btn = this;
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(txt).then(function () {
                        btn.textContent = 'Copied!';
                        toast('Copied to clipboard');
                        setTimeout(function () { btn.textContent = 'Copy'; }, 1200);
                    }).catch(function () { fallbackCopy(txt, btn); });
                } else {
                    fallbackCopy(txt, btn);
                }
            });
        }

        panel.classList.add('show');
        overlay.classList.add('show');
    }

    function fallbackCopy(text, btn) {
        var a = document.createElement('textarea');
        a.value = text;
        document.body.appendChild(a);
        a.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(a);
        btn.textContent = 'Copied!';
        toast('Copied to clipboard');
        setTimeout(function () { btn.textContent = 'Copy'; }, 1200);
    }

    function closePanel() {
        panel.classList.remove('show');
        overlay.classList.remove('show');
        selectedIcon = null;
        var cards = icGrid.querySelectorAll('.ic-card.selected');
        for (var i = 0; i < cards.length; i++) cards[i].classList.remove('selected');
    }

    panelClose.addEventListener('click', closePanel);
    overlay.addEventListener('click', closePanel);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePanel(); });

    // ===== Toast =====
    function toast(msg) {
        var t = document.createElement('div');
        t.className = 'toast-msg';
        t.textContent = msg;
        toastWrap.appendChild(t);
        setTimeout(function () { t.remove(); }, 2000);
    }
})();
</script>

</body>

</html>
