<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iconic</title>

  <!-- Speed: preconnect -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="preload" as="style" href="https://cdn.jsdelivr.net/gh/junaidprodeveloper/Iconic@2.0.0/iconic.min.css">
  <link id="iconic-css" rel="stylesheet" href="https://cdn.jsdelivr.net/gh/junaidprodeveloper/Iconic@2.0.0/iconic.min.css" />

  <style>
    :root{
      --bg:#FAF5EE;
      --surface:#FFFFFF;
      --surface-2:#FFFCF6;
      --border:#E9DDCC;
      --border-strong:#D9C6AE;
      --text:#3D2A1E;
      --text-soft:#8C7560;
      --text-faint:#B8A69A;
      --accent:#D07A5A;
      --accent-bg:#F9EFE6;
      --radius:14px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:"Merriweather", serif;
      -webkit-font-smoothing:antialiased;
      line-height:1.6;
    }
    .page-header{
      position:sticky;top:0;z-index:20;
      background:rgba(250,245,238,.97);
      border-bottom:1px solid var(--border);
      padding:16px 22px;
    }
    .header-inner{max-width:1440px;margin:0 auto;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
    .brand{font-family:"Merriweather", serif;font-size:26px;font-weight:900;letter-spacing:-.02em;margin:0}
    .search-wrap{
      display:flex;align-items:center;gap:8px;
      background:var(--surface);border:1px solid var(--border);
      border-radius:999px;padding:6px 6px 6px 14px;
      width:100%;max-width:460px;transition:.18s
    }
    .search-wrap:focus-within{border-color:var(--border-strong);box-shadow:0 0 0 3px var(--accent-bg)}
    .search-field{display:flex;align-items:center;gap:8px;flex:1}
    .search-field span{color:var(--text-faint)}
    .search-field input{border:none;outline:none;background:transparent;width:100%;font-family:"Merriweather", serif;font-size:13px;color:var(--text)}
    .search-field input::placeholder{color:var(--text-faint)}
    .search-trigger{border:none;background:var(--text);color:var(--bg);width:28px;height:28px;border-radius:999px;cursor:pointer;display:grid;place-items:center;font-size:12px}

    .main-col{max-width:1440px;margin:0 auto;padding:18px 22px 60px}
    .count-line{font-size:11.5px;color:var(--text-soft);margin:6px 2px 12px;font-family:"Merriweather", serif}
    #status{color:var(--text-soft);font-size:12px;padding:12px 2px}
    .icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px;content-visibility:auto;contain-intrinsic-size:800px}
    .icon-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;transition:.14s ease;contain:layout style paint}
    .icon-card:hover{border-color:var(--border-strong);transform:translateY(-2px);box-shadow:0 8px 18px rgba(61,42,30,.06);background:var(--surface-2)}
    .icon-card i-ic{font-size:26px;width:26px;height:26px;color:var(--text);--ic-color:currentColor}
    .icon-name{font-size:10.5px;font-weight:700;color:var(--text-soft);text-align:center;line-height:1.25;word-break:break-word;font-family:"Merriweather", serif}

    .empty{grid-column:1/-1;background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius);padding:30px;text-align:center;color:var(--text-soft);font-size:13px}
    .load-more{grid-column:1/-1;display:flex;justify-content:center;padding:8px}
    .load-more button{border:1px solid var(--border);background:var(--surface);padding:8px 14px;border-radius:999px;cursor:pointer;font-size:11px;font-weight:700;color:var(--text-soft);font-family:"Merriweather", serif}

    /* PANEL - hidden by default, no blur background */
    .detail-overlay{
      position:fixed;inset:0;
      background:transparent !important;
      backdrop-filter:none !important;
      -webkit-backdrop-filter:none !important;
      opacity:0;visibility:hidden;
      transition:.2s;z-index:50;
    }
    .detail-overlay.open{opacity:1;visibility:visible;background:transparent !important}
    .detail-panel{
      position:fixed;top:0;right:-460px;
      width:440px;max-width:94vw;height:100%;
      background:var(--surface);
      border-left:1px solid var(--border);
      z-index:60;overflow:auto;
      transition:right .33s cubic-bezier(.32,.72,0,1);
      box-shadow:-12px 0 40px rgba(61,42,30,.10);
      scrollbar-width:thin;
    }
    .detail-panel.open{right:0}
    .detail-header{position:sticky;top:0;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;z-index:2}
    .detail-title{margin:0;font-size:17px;font-weight:900;letter-spacing:-.01em;text-transform:lowercase;font-family:"Merriweather", serif}
    .detail-close{width:28px;height:28px;border-radius:999px;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:grid;place-items:center;color:var(--text-soft);font-family:"Merriweather", serif}
    .detail-body{padding:14px 16px 0}
    .preview-box{
      height:132px;border:1px solid var(--border);background:var(--bg);
      border-radius:12px;display:grid;place-items:center;
      font-size:56px;margin-bottom:12px;position:relative;overflow:hidden
    }
    .preview-box i-ic{font-size:1em;width:1em;height:1em;color:var(--text)}
    .preview-hint{position:absolute;bottom:6px;right:8px;font-size:9px;color:var(--text-faint);font-family:"Merriweather", serif;letter-spacing:.04em;text-transform:uppercase}

    .live-code{position:relative;background:#2B211A;border:1px solid #3D2E22;border-radius:10px;overflow:hidden;margin-bottom:16px}
    .live-code pre{margin:0;padding:11px 44px 11px 11px;font-family:"JetBrains Mono", monospace;font-size:11px;line-height:1.5;color:#E9DDD0;white-space:pre-wrap;word-break:break-word}
    .copy-btn{position:absolute;top:6px;right:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:5px 9px;border-radius:7px;font-size:10px;font-weight:700;cursor:pointer;font-family:"Merriweather", serif}
    .copy-btn.dark{background:#3D2E22;color:#E9DDD0;border-color:#4A3728}

    .detail-section{margin-bottom:16px;padding-bottom:12px;border-bottom:1px dashed var(--border)}
    .detail-section:last-child{border-bottom:none}
    .detail-section h3{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--text-faint);margin:0 0 8px;font-family:"Merriweather", serif;display:flex;align-items:center;justify-content:space-between}
    .detail-section h3 small{font-weight:400;text-transform:none;letter-spacing:0;color:var(--text-faint);font-size:10px}

    .util-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
    .util-grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .util-grid.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
    .util-pill{
      background:var(--bg);border:1px solid var(--border);border-radius:8px;
      padding:7px 4px;text-align:center;font-size:10px;font-weight:700;
      font-family:"JetBrains Mono", monospace;color:var(--text-soft);
      cursor:pointer;transition:.13s;user-select:none;line-height:1.2
    }
    .util-pill:hover{border-color:var(--border-strong);color:var(--text);transform:translateY(-1px)}
    .util-pill.active{background:var(--text);color:var(--bg);border-color:var(--text);box-shadow:0 2px 8px rgba(61,42,30,.18)}
    .util-pill.active:hover{background:#2a1d13}

    .var-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
    .var-row label{flex:1;font-size:11px;font-weight:600;color:var(--text-soft);font-family:"Merriweather", serif;min-width:0}
    .var-row label code{font-family:"JetBrains Mono", monospace;font-size:10px;background:var(--bg);border:1px solid var(--border);padding:1px 5px;border-radius:5px;color:var(--text)}
    .var-row input[type="range"]{flex:1;max-width:120px;accent-color:var(--accent)}
    .var-row input[type="color"]{width:32px;height:26px;border-radius:6px;border:1px solid var(--border);padding:2px;background:var(--surface);cursor:pointer}
    .var-row input[type="text"]{flex:1;max-width:120px;border:1px solid var(--border);border-radius:7px;padding:4px 7px;font-size:11px;font-family:"JetBrains Mono", monospace;background:var(--surface)}
    .var-value{font-size:10px;color:var(--text-faint);font-family:"JetBrains Mono", monospace;min-width:34px;text-align:right}

    .instruct-small{font-size:11px;color:var(--text-soft);line-height:1.5;font-family:"Merriweather", serif;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:12px}
    .instruct-small b{color:var(--text)}
    .detail-footer{padding:12px 16px 18px;border-top:1px solid var(--border);text-align:center;color:var(--text-faint);font-size:10px;font-family:"Merriweather", serif}
  </style>
</head>
<body>
  <header class="page-header">
    <div class="header-inner">
      <h1 class="brand">Iconic</h1>
      <div id="search-container" class="search-wrap active">
        <label class="search-field">
          <span>⌕</span>
          <input id="search-input" type="search" placeholder="Search 19,052 icons..." autocomplete="off" spellcheck="false" autofocus />
          <input id="search" type="hidden" />
        </label>
        <button id="search-trigger" class="search-trigger" type="button">↗</button>
      </div>
    </div>
  </header>

  <main class="main-col">
    <div id="icon-count" class="count-line">Loading 19,052 icons...</div>
    <div id="icon-count" class="count-line">By mistake some icons duplicate</div>
    <div id="status">Parsing official Iconic stylesheet…</div>
    <div id="icon-grid" class="icon-grid" aria-live="polite"></div>
  </main>

  <aside id="detail-panel" class="detail-panel" aria-hidden="true">
    <div id="detail-content"></div>
  </aside>
  <div id="detail-overlay" class="detail-overlay"></div>

<script>
// customElements required
if (!customElements.get('icon-ic')) {
  window.customElements.define('icon-ic', class extends HTMLElement { connectedCallback(){ this.style.display = this.style.display || 'inline-block'; } });
}
if (!customElements.get('i-ic')) { try{ customElements.define('i-ic', class extends HTMLElement { connectedCallback(){ if(!this.style.display) this.style.display='inline-block'; }});}catch(e){} }

const stylesheetUrl = "https://cdn.jsdelivr.net/gh/junaidprodeveloper/Iconic@2.0.0/iconic.min.css";
const grid = document.getElementById("icon-grid");
const countEl = document.getElementById("icon-count");
const statusEl = document.getElementById("status");
const searchInput = document.getElementById("search-input");
const searchLegacy = document.getElementById("search");
const searchTrigger = document.getElementById("search-trigger");
const searchContainer = document.getElementById("search-container");
const detailPanel = document.getElementById("detail-panel");
const detailOverlay = document.getElementById("detail-overlay");
const detailContent = document.getElementById("detail-content");

let iconNames=[], iconMeta=[], filtered=[], searchCache=new Map(), renderLimit=280, lastQuery='';

// --- Parsing / Search (ultra fast) ---
function levenshteinLimited(a,b,limit=2){
  if(Math.abs(a.length-b.length)>limit) return limit+1;
  if(a.length>b.length){[a,b]=[b,a];}
  let prev=new Uint16Array(b.length+1), cur=new Uint16Array(b.length+1);
  for(let j=0;j<=b.length;j++) prev[j]=j;
  for(let i=1;i<=a.length;i++){
    cur[0]=i; let min=cur[0]; const ca=a.charCodeAt(i-1);
    for(let j=1;j<=b.length;j++){
      const cost=ca===b.charCodeAt(j-1)?0:1;
      cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+cost);
      if(cur[j]<min) min=cur[j];
    }
    if(min>limit) return limit+1;
    [prev,cur]=[cur,prev];
  }
  return prev[b.length];
}
function getIconNames(cssText){
  const set=new Set(); const re=/\.ic-([a-z0-9]+(?:-[a-z0-9]+)*)/gi; let m;
  const banned=new Set(['2x','3x','4x','5x','6x','7x','8x','9x','10x','xs','sm','md','lg','xl','fw','spin','pulse','paused','flip-x','flip-y','flip-h','rotate-45','rotate-90','rotate-135','rotate-180','rotate-225','rotate-270','rotate-315','shadow','round','round-soft','tile','bordered','hover-bounce','hover-grow','hover-rotate','hover-shrink','hover-float','hover-glow','hover-fade','hover-color','clickable','text-primary','text-success','text-danger','text-warning','text-info','text-light','text-dark','text-muted']);
  while((m=re.exec(cssText))){ const n=m[1].toLowerCase(); if(!banned.has(n)) set.add(n); }
  return [...set].sort();
}
function scoreIcon(meta,q,toks){
  const name=meta.name; if(!q) return 1;
  let s=0; if(name===q) return 100000;
  if(name.startsWith(q)) s+=8000 - name.length*2;
  const idx=name.indexOf(q); if(idx!==-1) s+=5000 - idx*10;
  let hits=0,pen=0;
  for(const t of toks){
    if(name.includes(t)){ hits++; s+=1200; if(meta.tokens.includes(t)) s+=700; }
    else{
      let f=false; for(const seg of meta.tokens){ if(Math.abs(seg.length-t.length)>2) continue; if(levenshteinLimited(seg,t,1)<=1){f=true;break;} }
      if(f){hits++; s+=250;} else pen+=500;
    }
  }
  if(toks.length>1 && hits===toks.length) s+=3000;
  s-=pen+meta.len*0.4; return s>0?s:0;
}
function ultraSearch(q){
  q=q.toLowerCase().trim();
  if(searchCache.has(q)) return searchCache.get(q);
  if(!q){ searchCache.set(q, iconMeta); return iconMeta; }
  const toks=q.split(/[\s\-_]+/).filter(Boolean);
  const scored=[]; for(const meta of iconMeta){ const sc=scoreIcon(meta,q,toks); if(sc>0) scored.push([meta,sc]); }
  scored.sort((a,b)=>b[1]-a[1] || a[0].len-b[0].len || a[0].name.localeCompare(b[0].name));
  const res=scored.map(x=>x[0]); if(searchCache.size>500) searchCache.clear(); searchCache.set(q,res); return res;
}
function createCard(meta){
  const btn=document.createElement('button'); btn.className='icon-card card'; btn.type='button'; btn.dataset.name=meta.name;
  const ic=document.createElement('i-ic'); ic.className=`ic-${meta.name}`; ic.setAttribute('aria-hidden','true');
  const label=document.createElement('span'); label.className='icon-name car-h1'; label.textContent=meta.name;
  btn.appendChild(ic); btn.appendChild(label); return btn;
}
function renderIcons(){
  const q=searchInput.value.toLowerCase().trim();
  const t0=performance.now(); filtered=ultraSearch(q);
  countEl.textContent=`${filtered.length} icons • ${(performance.now()-t0).toFixed(1)}ms`;
  grid.textContent=''; if(!filtered.length){ const e=document.createElement('div'); e.className='empty'; e.textContent=`No icons for “${q}”`; grid.appendChild(e); return; }
  const frag=document.createDocumentFragment(); filtered.slice(0,renderLimit).forEach(m=>frag.appendChild(createCard(m))); grid.appendChild(frag);
  if(filtered.length>renderLimit){ const more=document.createElement('div'); more.className='load-more'; const b=document.createElement('button'); b.id='load-more-btn'; b.textContent=`Show more (${filtered.length-renderLimit} left)`; more.appendChild(b); grid.appendChild(more); }
}
let raf=null;
function scheduleRender(){ if(raf) cancelAnimationFrame(raf); raf=requestAnimationFrame(()=>{ const q=searchInput.value; if(searchLegacy) searchLegacy.value=q; if(q===lastQuery && grid.children.length) return; lastQuery=q; renderLimit=280; renderIcons(); }); }
async function loadIcons(){
  try{
    const cached=localStorage.getItem('iconic-names-v6');
    if(cached){ try{ const p=JSON.parse(cached); if(Array.isArray(p)&&p.length>200) iconNames=p; }catch{} }
    if(!iconNames.length){
      const r=await fetch(stylesheetUrl,{cache:'force-cache'}); const txt=await r.text(); iconNames=getIconNames(txt);
      try{ localStorage.setItem('iconic-names-v6', JSON.stringify(iconNames)); }catch{}
    }
    iconMeta=iconNames.map(n=>({name:n,tokens:n.split('-'),len:n.length}));
    statusEl.remove(); renderIcons();
  }catch(e){ statusEl.textContent='Could not load icons.'; }
}
document.addEventListener("DOMContentLoaded", ()=>{
  const performSearch=()=>scheduleRender();
  searchInput.addEventListener("input", performSearch, {passive:true});
  searchInput.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); performSearch(); }});
  searchTrigger.addEventListener("click", e=>{ e.preventDefault(); searchContainer.classList.add("active"); searchInput.focus(); performSearch(); });
  document.addEventListener("keydown", e=>{
    if(e.key==="/" && document.activeElement!==searchInput){ e.preventDefault(); searchInput.focus(); }
    if(e.key==="Escape") closePanel();
  });
});
new IntersectionObserver(entries=>{
  for(const en of entries){ if(en.isIntersecting && filtered.length>renderLimit){ renderLimit+=220; renderIcons(); break; } }
},{rootMargin:'500px'}).observe(grid);
new MutationObserver(()=>{ const b=document.getElementById('load-more-btn'); if(b) new IntersectionObserver((es)=>{ for(const en of es){ if(en.isIntersecting && filtered.length>renderLimit){ renderLimit+=220; renderIcons(); break; } }},{rootMargin:'400px'}).observe(b); }).observe(grid,{childList:true});
grid.addEventListener('click',e=>{
  const more=e.target.closest('#load-more-btn'); if(more){ renderLimit+=300; renderIcons(); return; }
  const card=e.target.closest('.icon-card'); if(card) openPanel(`ic-${card.dataset.name}`);
});
loadIcons();

// ==================== PRO PANEL - recommends ALL properties ====================
let currentIconClass='ic-home';
let state={
  size:'',
  animation:new Set(),
  transform:new Set(),
  layout:new Set(),
  decor:new Set(),
  hover:new Set(),
  color:'',
  vars:{
    '--ic-size':'3em',
    '--ic-color':'currentColor',
    '--ic-opacity':'1',
    '--ic-duration':'0.25s',
    '--ic-radius':'0px',
    '--ic-blur':'0px',
    '--ic-brightness':'1',
    '--ic-contrast':'1',
    '--ic-saturate':'1',
    '--ic-hue-rotate':'0deg',
    '--ic-shadow':'0 4px 12px rgba(0,0,0,.18)',
    '--ic-glow-color':'rgba(64,160,255,.65)',
  }
};

const GROUPS={
  size:['','ic-xs','ic-sm','ic-md','ic-lg','ic-xl','ic-2x','ic-3x','ic-4x','ic-5x','ic-6x'],
  animation:['ic-spin','ic-pulse','ic-paused'],
  transform:['ic-flip-x','ic-flip-y','ic-flip-h','ic-rotate-45','ic-rotate-90','ic-rotate-135','ic-rotate-180','ic-rotate-225','ic-rotate-270','ic-rotate-315'],
  layout:['ic-fw','ic-tile','ic-bordered'],
  decor:['ic-shadow','ic-round','ic-round-soft'],
  hover:['ic-hover-grow','ic-hover-shrink','ic-hover-rotate','ic-hover-float','ic-hover-bounce','ic-hover-glow','ic-hover-fade','ic-hover-color','ic-clickable'],
  color:['','ic-text-primary','ic-text-success','ic-text-danger','ic-text-warning','ic-text-info','ic-text-dark','ic-text-muted'],
};

function openPanel(iconClass){
  currentIconClass=iconClass;
  state={ size:'ic-3x', animation:new Set(), transform:new Set(), layout:new Set(), decor:new Set(), hover:new Set(['ic-hover-grow']), color:'', vars:{...state.vars, '--ic-size':'3em'} };
  buildPanel();
  detailPanel.classList.add('open'); detailOverlay.classList.add('open');
}
function closePanel(){ detailPanel.classList.remove('open'); detailOverlay.classList.remove('open'); }
detailOverlay.addEventListener('click', closePanel);

function buildPanel(){
  detailContent.textContent='';
  const header=document.createElement('div'); header.className='detail-header';
  const title=document.createElement('h2'); title.className='detail-title'; title.textContent=currentIconClass.replace(/^ic-/,'');
  const closeBtn=document.createElement('button'); closeBtn.className='detail-close'; closeBtn.textContent='×'; closeBtn.onclick=closePanel;
  header.appendChild(title); header.appendChild(closeBtn);

  const body=document.createElement('div'); body.className='detail-body';

  // Preview
  const previewBox=document.createElement('div'); previewBox.className='preview-box';
  const live=document.createElement('i-ic'); live.id='live-preview'; live.className=currentIconClass; previewBox.appendChild(live);
  const hint=document.createElement('div'); hint.className='preview-hint'; hint.textContent='hover to see hover effects'; previewBox.appendChild(hint);
  body.appendChild(previewBox);

  // Live code
  const liveSec=document.createElement('div'); liveSec.className='detail-section';
  const liveH=document.createElement('h3'); liveH.innerHTML='LIVE CODE <small>updates as you pick properties</small>'; liveSec.appendChild(liveH);
  const liveWrap=document.createElement('div'); liveWrap.className='live-code';
  const livePre=document.createElement('pre'); livePre.id='live-code-pre'; liveWrap.appendChild(livePre);
  const copyLive=document.createElement('button'); copyLive.className='copy-btn dark'; copyLive.textContent='Copy'; copyLive.onclick=()=>{ navigator.clipboard.writeText(livePre.textContent); copyLive.textContent='Copied!'; setTimeout(()=>copyLive.textContent='Copy',1000); };
  liveWrap.appendChild(copyLive); liveSec.appendChild(liveWrap); body.appendChild(liveSec);

  // How this works
  const baseSec=document.createElement('div'); baseSec.className='detail-section';
  baseSec.innerHTML=`<h3>Base usage</h3>`;
  function staticCode(h, code){
    const s=document.createElement('div'); s.style.marginBottom='8px';
    const hh=document.createElement('div'); hh.style.fontSize='10px'; hh.style.color='var(--text-faint)'; hh.textContent=h;
    const wrap=document.createElement('div'); wrap.className='live-code'; wrap.style.background='var(--bg)'; wrap.style.borderColor='var(--border)';
    const pre=document.createElement('pre'); pre.textContent=code; pre.style.color='var(--text)'; wrap.appendChild(pre);
    const btn=document.createElement('button'); btn.className='copy-btn'; btn.textContent='Copy'; btn.onclick=()=>{navigator.clipboard.writeText(code); btn.textContent='Copied!'; setTimeout(()=>btn.textContent='Copy',900);}; wrap.appendChild(btn);
    s.appendChild(hh); s.appendChild(wrap); return s;
  }
  baseSec.appendChild(staticCode('Include in <head>', `<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/junaidprodeveloper/Iconic@2.0.0/iconic.min.css">`));
  baseSec.appendChild(staticCode('Simple', `<i-ic class="${currentIconClass}"></i-ic>`));
  body.appendChild(baseSec);

  // Helper to create group
  function createGroup(title, key, cols=''){
    const sec=document.createElement('div'); sec.className='detail-section';
    const h=document.createElement('h3'); h.textContent=title; sec.appendChild(h);
    const grid=document.createElement('div'); grid.className=`util-grid ${cols}`;
    const items=GROUPS[key];
    items.forEach(name=>{
      const pill=document.createElement('div'); pill.className='util-pill'; pill.textContent=name || '(none)';
      const isActive=()=>{
        if(key==='size') return state.size===name;
        if(key==='color') return state.color===name;
        if(key==='animation') return state.animation.has(name);
        if(key==='transform') return state.transform.has(name);
        if(key==='layout') return state.layout.has(name);
        if(key==='decor') return state.decor.has(name);
        if(key==='hover') return state.hover.has(name);
      };
      if(isActive()) pill.classList.add('active');
      pill.onclick=()=>{
        if(key==='size'){
          state.size = state.size===name ? '' : name;
        } else if(key==='color'){
          state.color = state.color===name ? '' : name;
        } else if(key==='animation'){
          if(state.animation.has(name)) state.animation.delete(name); else state.animation.add(name);
        } else if(key==='transform'){
          if(state.transform.has(name)) state.transform.delete(name); else state.transform.add(name);
        } else if(key==='layout'){
          if(state.layout.has(name)) state.layout.delete(name); else state.layout.add(name);
        } else if(key==='decor'){
          if(state.decor.has(name)) state.decor.delete(name); else state.decor.add(name);
        } else if(key==='hover'){
          if(state.hover.has(name)) state.hover.delete(name); else state.hover.add(name);
        }
        buildPanel(); // rebuild to update active states, but keep scroll pos
        // restore scroll
        // Instead of full rebuild, we call updateLive directly for performance - but for simplicity rebuild list active needs refresh
        const y=detailPanel.scrollTop;
        setTimeout(()=> detailPanel.scrollTop=y,0);
        updateLive();
      };
      grid.appendChild(pill);
    });
    sec.appendChild(grid); return sec;
  }

  body.appendChild(createGroup('Size modifiers — ic-xs to ic-10x','size','cols-4'));
  body.appendChild(createGroup('Animation — spin / pulse / paused','animation','cols-2'));
  body.appendChild(createGroup('Transform — flip & rotate','transform',''));
  body.appendChild(createGroup('Layout helpers — fw / tile / bordered','layout','cols-2'));
  body.appendChild(createGroup('Decorative — shadow / round / soft','decor','cols-2'));
  body.appendChild(createGroup('Hover effects — grow shrink rotate float bounce glow fade','hover',''));
  body.appendChild(createGroup('Color utilities — text-primary ... muted','color','cols-2'));

  // CSS Variables - from your pasted file
  const varSec=document.createElement('div'); varSec.className='detail-section';
  const varH=document.createElement('h3'); varH.textContent='CSS Variables — theme tokens from Iconic.css'; varSec.appendChild(varH);
  const varInfo=document.createElement('div'); varInfo.className='instruct-small';
  varInfo.innerHTML=`From <code>:root</code> in your file — change live. <br><b>--ic-size</b> base size, <b>--ic-color</b> tint, <b>--ic-duration</b> motion, <b>--ic-opacity</b>, <b>--ic-radius</b>, filters, shadow, glow.`;
  varSec.appendChild(varInfo);

  function varRow(label, cssVar, type='text', opts={}){
    const row=document.createElement('div'); row.className='var-row';
    const lab=document.createElement('label'); lab.innerHTML=`<code>${cssVar}</code>`; row.appendChild(lab);
    let input;
    if(type==='color'){
      input=document.createElement('input'); input.type='color';
      input.value=opts.val && opts.val.startsWith('#') ? opts.val : '#3D2A1E';
      const isCurrent=state.vars[cssVar]==='currentColor';
      if(isCurrent) input.value='#3D2A1E';
      input.oninput=()=>{ state.vars[cssVar]=input.value; updateLive(); };
    } else if(type==='range'){
      input=document.createElement('input'); input.type='range';
      input.min=opts.min; input.max=opts.max; input.step=opts.step || 1;
      let cur=state.vars[cssVar]; let num=parseFloat(cur) || 0;
      if(cssVar.includes('opacity')){ num=parseFloat(cur); input.value=num; }
      else if(cssVar.includes('size')){ num=parseFloat(cur); input.value=num; }
      else input.value=opts.defVal || num;
      const valSpan=document.createElement('span'); valSpan.className='var-value'; valSpan.textContent=state.vars[cssVar];
      input.oninput=()=>{
        let v=input.value;
        if(cssVar==='--ic-size') v=v+'em';
        else if(cssVar==='--ic-opacity') v=v;
        else if(cssVar==='--ic-duration') v=v+'s';
        else if(cssVar==='--ic-radius') v=v+'px';
        else if(cssVar==='--ic-blur') v=v+'px';
        else if(cssVar.includes('brightness')||cssVar.includes('contrast')||cssVar.includes('saturate')) v=v;
        else if(cssVar.includes('hue')) v=v+'deg';
        state.vars[cssVar]=v; valSpan.textContent=v; updateLive();
      };
      row.appendChild(input); row.appendChild(valSpan); return row;
    } else {
      input=document.createElement('input'); input.type='text'; input.value=state.vars[cssVar];
      input.oninput=()=>{ state.vars[cssVar]=input.value; updateLive(); };
    }
    const valSpan=document.createElement('span'); valSpan.className='var-value'; valSpan.textContent=state.vars[cssVar];
    row.appendChild(input);
    if(type!=='range') row.appendChild(valSpan);
    // currentColor toggle for --ic-color
    if(cssVar==='--ic-color'){
      const btn=document.createElement('button'); btn.className='copy-btn'; btn.style.position='static'; btn.style.marginLeft='6px'; btn.textContent=state.vars[cssVar]==='currentColor'?'currentColor':'custom';
      btn.onclick=()=>{ state.vars[cssVar]= state.vars[cssVar]==='currentColor' ? '#D07A5A' : 'currentColor'; buildPanel(); updateLive(); };
      row.appendChild(btn);
    }
    return row;
  }

  varSec.appendChild(varRow('--ic-size', '--ic-size','range',{min:0.5,max:6,step:0.25}));
  varSec.appendChild(varRow('--ic-color', '--ic-color','color',{}));
  varSec.appendChild(varRow('--ic-opacity', '--ic-opacity','range',{min:0.1,max:1,step:0.1}));
  varSec.appendChild(varRow('--ic-duration', '--ic-duration','range',{min:0.1,max:3,step:0.1}));
  varSec.appendChild(varRow('--ic-radius', '--ic-radius','range',{min:0,max:32,step:2}));
  varSec.appendChild(varRow('--ic-blur (filter)', '--ic-blur','range',{min:0,max:10,step:1}));
  varSec.appendChild(varRow('--ic-shadow', '--ic-shadow','text',{}));
  varSec.appendChild(varRow('--ic-glow-color', '--ic-glow-color','text',{}));

  body.appendChild(varSec);

  // Advanced filters from file comment
  const filtSec=document.createElement('div'); filtSec.className='detail-section';
  filtSec.innerHTML=`<h3>Filter chain — --ic-filter tokens</h3><div class="instruct-small">Iconic uses <code>filter: var(--ic-filter) blur(var(--ic-blur)) brightness(var(--ic-brightness)) contrast(var(--ic-contrast)) saturate(var(--ic-saturate)) hue-rotate(var(--ic-hue-rotate)) drop-shadow(var(--ic-drop-shadow))</code>. Tune with vars above + brightness/contrast.</div>`;
  body.appendChild(filtSec);

  detailContent.appendChild(header);
  detailContent.appendChild(body);
  const foot=document.createElement('div'); foot.className='detail-footer'; foot.innerHTML=`19,052 icons • icons=4,508 icons2=1,783 icons3=3,229 icons4=3,024 icons5=5,371 • Generated 2026-07-15 • No blur background`;
  detailContent.appendChild(foot);

  updateLive();
}

function updateLive(){
  const live=document.getElementById('live-preview');
  const pre=document.getElementById('live-code-pre');
  if(!live || !pre) return;
  const classes=[currentIconClass, state.size, ...state.animation, ...state.transform, ...state.layout, ...state.decor, ...state.hover, state.color].filter(Boolean).join(' ').trim();
  live.className=classes;

  // apply vars
  Object.entries(state.vars).forEach(([k,v])=>{ live.style.setProperty(k,v); });

  // build style attr for code
  const styleEntries=Object.entries(state.vars).filter(([k,v])=>{
    // hide defaults for cleaner code, but show if changed
    const defaults={'--ic-size':'3em','--ic-color':'currentColor','--ic-opacity':'1','--ic-duration':'0.25s','--ic-radius':'0px','--ic-blur':'0px','--ic-brightness':'1','--ic-contrast':'1','--ic-saturate':'1','--ic-hue-rotate':'0deg'};
    // keep if not default or if it's size/color custom
    return v!=='' && ( !defaults[k] || defaults[k]!==v || k==='--ic-color' );
  }).map(([k,v])=>`${k}:${v}`).join('; ');
  const styleAttr = styleEntries ? ` style="${styleEntries}"` : '';
  pre.textContent = `<i-ic class="${classes}"${styleAttr}></i-ic>`;
}

window.openIconPanel=openPanel;
</script>
</body>
</html>
