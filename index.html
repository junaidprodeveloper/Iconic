    <style id="iconic-css">
        /* ============================================
   ICONIC - Custom SVG Icon Library
   ============================================ */
        [class^="icon-"],
        [class*=" icon-"] {
            display: inline-block;
            width: 1em;
            height: 1em;
            vertical-align: -0.125em;
            line-height: 1;
            font-size: inherit;
            flex-shrink: 0;
        }

        icon-ic {
            display: inline-block;
            width: 1em;
            height: 1em;
            vertical-align: -0.125em;
            line-height: 1;
            font-size: inherit;
            flex-shrink: 0;
        }

        [class^="icon-"]::after,
        [class*=" icon-"]::after {
            content: "";
            display: block;
            width: 100%;
            height: 100%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        .icon-xs {
            font-size: 0.75rem;
        }

        .icon-sm {
            font-size: 0.875rem;
        }

        .icon-md {
            font-size: 1rem;
        }

        .icon-lg {
            font-size: 1.25rem;
        }

        .icon-xl {
            font-size: 1.5rem;
        }

        .icon-2x {
            font-size: 2rem;
        }

        .icon-3x {
            font-size: 3rem;
        }

        .icon-4x {
            font-size: 4rem;
        }

        .icon-5x {
            font-size: 5rem;
        }

        .icon-6x {
            font-size: 6rem;
        }

        .icon-7x {
            font-size: 7rem;
        }

        .icon-8x {
            font-size: 8rem;
        }

        .icon-9x {
            font-size: 9rem;
        }

        .icon-10x {
            font-size: 10rem;
        }

        .icon-spin {
            animation: icon-spin 1s linear infinite;
        }

        .icon-pulse {
            animation: icon-spin 1s steps(8) infinite;
        }

        .icon-bounce {
            animation: icon-bounce 1s ease infinite;
        }

        .icon-fade {
            animation: icon-fade 1s ease-in-out infinite;
        }

        .icon-beat {
            animation: icon-beat 1s ease-in-out infinite;
        }

        .icon-shake {
            animation: icon-shake 0.5s ease-in-out infinite;
        }

        @keyframes icon-spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes icon-bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            25% {
                transform: translateY(-6px);
            }

            50% {
                transform: translateY(0);
            }

            75% {
                transform: translateY(-3px);
            }
        }

        @keyframes icon-fade {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        @keyframes icon-beat {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.25);
            }
        }

        @keyframes icon-shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-4px);
            }

            75% {
                transform: translateX(4px);
            }
        }

        .icon-rotate-90 {
            transform: rotate(90deg);
        }

        .icon-rotate-180 {
            transform: rotate(180deg);
        }

        .icon-rotate-270 {
            transform: rotate(270deg);
        }

        .icon-flip-horizontal {
            transform: scaleX(-1);
        }

        .icon-flip-vertical {
            transform: scaleY(-1);
        }

        .icon-flip-both {
            transform: scale(-1);
        }

        .icon-fw {
            text-align: center;
            width: 1.25em;
        }

        .icon-ul {
            list-style-type: none;
            margin-left: 2em;
            padding-left: 0;
        }

        .icon-ul>li {
            position: relative;
        }

        .icon-li {
            left: -2em;
            position: absolute;
            text-align: center;
            width: 2em;
            line-height: inherit;
        }

        .icon-stack {
            display: inline-block;
            height: 2em;
            line-height: 2em;
            position: relative;
            vertical-align: middle;
            width: 2em;
        }

        .icon-stack-1x,
        .icon-stack-2x {
            left: 0;
            position: absolute;
            text-align: center;
            width: 100%;
        }

        .icon-stack-1x {
            font-size: 1em;
            line-height: inherit;
        }

        .icon-stack-2x {
            font-size: 2em;
        }

    <!-- ============================================================

     ============================================================ -->
    <style>
        :root {
            --bg-deep: #f8f6f6;
            --bg: #f8f5f8;
            --bg-surface: #F8F8F6;
            --bg-card: #F8F8F6;
            --bg-hover: ##F8F8F6;
            --bg-active: #F8F8F6;
            --fg: #D97757;
            --fg-sec: #a0a0aa;
            --fg-muted: #5c5c66;
            --accent: #D97757;
            --accent-h: #D97757;
            --accent-soft: #F8F8F6;
            --accent-glow: #F8F8F6;
            --success: #22c55e;
            --border: #222228;
            --border-h: #333340;
            --radius: 10px;
            --radius-sm: 7px;
            --tr: .2s cubic-bezier(.4, 0, .2, 1);
            --sidebar-w: 230px;
            --navbar-h: 60px;
            --panel-w: 380px;
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        html {
            scrollbar-width: thin;
            scrollbar-color: var(--border-h) transparent
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            background: var(--bg);
            color: var(--fg);
            line-height: 1.5;
            overflow: hidden;
            height: 100vh
        }

        /* ===== NAVBAR ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--navbar-h);
            background: var(--bg-deep);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 16px;
            z-index: 100
        }

        .navbar::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-glow), transparent);
            pointer-events: none
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0
        }

        .nav-logo-box {
            width: 34px;
            height: 34px;
            background: linear-gradient(135deg, var(--accent), #fb923c);
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center
        }

        .nav-logo-box svg {
            width: 18px;
            height: 18px;
            color: #fff
        }

        .nav-logo-text {
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: -.03em;
            color: var(--fg)
        }

        .nav-logo-text span {
            color: var(--accent)
        }

        .nav-search {
            flex: 1;
            max-width: 480px;
            position: relative
        }

        .nav-search input {
            width: 100%;
            padding: 9px 14px 9px 38px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--fg);
            font-family: inherit;
            font-size: .875rem;
            outline: none;
            transition: all var(--tr)
        }

        .nav-search input::placeholder {
            color: var(--fg-muted)
        }

        .nav-search input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft)
        }

        .nav-search svg {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            color: var(--fg-muted);
            pointer-events: none
        }

        .nav-badge {
            background: var(--accent-soft);
            color: var(--accent);
            font-size: .75rem;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(249, 115, 22, .15);
            white-space: nowrap;
            font-family: 'JetBrains Mono', monospace
        }

        .nav-ver {
            font-size: .7rem;
            color: var(--fg-muted);
            margin-left: auto;
            flex-shrink: 0
        }

        /* ===== LAYOUT ===== */
        .layout {
            display: flex;
            height: 100vh;
            padding-top: var(--navbar-h)
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: var(--sidebar-w);
            flex-shrink: 0;
            background: var(--bg-deep);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 16px 0;
            scrollbar-width: thin;
            scrollbar-color: var(--border-h) transparent
        }

        .sidebar-label {
            font-size: .65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .1em;
            color: var(--fg-muted);
            padding: 12px 20px 8px
        }

        .sb-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 20px;
            cursor: pointer;
            transition: all var(--tr);
            border-left: 3px solid transparent;
            color: var(--fg-sec);
            font-size: .85rem;
            font-weight: 500
        }

        .sb-item:hover {
            background: var(--bg-surface);
            color: var(--fg)
        }

        .sb-item.active {
            background: var(--accent-soft);
            color: var(--accent);
            border-left-color: var(--accent)
        }

        .sb-count {
            font-size: .7rem;
            font-family: 'JetBrains Mono', monospace;
            color: var(--fg-muted);
            background: var(--bg-surface);
            padding: 1px 7px;
            border-radius: 10px
        }

        .sb-item.active .sb-count {
            background: rgba(249, 115, 22, .12);
            color: var(--accent)
        }

        /* ===== MAIN CONTENT ===== */
        .main {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            scroll-behavior: smooth
        }

        .main-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px
        }

        .main-title {
            font-size: 1.1rem;
            font-weight: 600
        }

        .main-title b {
            color: var(--accent);
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700
        }

        /* ===== ICON GRID ===== */
        .ic-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
            gap: 8px
        }

        .ic-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 8px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all var(--tr);
            position: relative;
            content-visibility: auto;
            contain-intrinsic-size: 0 90px
        }

        .ic-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(circle at 50% 30%, var(--accent-soft), transparent 70%);
            opacity: 0;
            transition: opacity var(--tr);
            pointer-events: none
        }

        .ic-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, .3)
        }

        .ic-card:hover::before {
            opacity: 1
        }

        .ic-card:active {
            transform: scale(.96)
        }

        .ic-card.selected {
            border-color: var(--accent);
            background: var(--accent-soft)
        }

        .ic-card icon-ic {
            font-size: 1.6rem;
            color: var(--fg-sec);
            transition: color var(--tr);
            line-height: 1
        }

        .ic-card:hover icon-ic {
            color: var(--fg)
        }

        .ic-name {
            font-size: .58rem;
            font-family: 'JetBrains Mono', monospace;
            color: var(--fg-muted);
            text-align: center;
            line-height: 1.25;
            word-break: break-all;
            max-height: 2.5em;
            overflow: hidden;
            transition: color var(--tr)
        }

        .ic-card:hover .ic-name {
            color: var(--fg-sec)
        }

        /* ===== EMPTY STATE ===== */
        .empty {
            grid-column: 1/-1;
            text-align: center;
            padding: 80px 20px;
            color: var(--fg-muted)
        }

        .empty svg {
            width: 48px;
            height: 48px;
            margin-bottom: 12px;
            opacity: .3
        }

        .empty h3 {
            font-size: 1rem;
            color: var(--fg-sec);
            font-weight: 500;
            margin-bottom: 4px
        }

        /* ===== DETAIL PANEL ===== */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .5);
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity .3s ease
        }

        .overlay.show {
            opacity: 1;
            pointer-events: auto
        }

        .panel {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: var(--panel-w);
            background: var(--bg-deep);
            border-left: 1px solid var(--border);
            z-index: 201;
            transform: translateX(100%);
            transition: transform .35s cubic-bezier(.4, 0, .2, 1);
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--border-h) transparent
        }

        .panel.show {
            transform: translateX(0)
        }

        .pn-close {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 32px;
            height: 32px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--fg-muted);
            transition: all var(--tr);
            z-index: 5
        }

        .pn-close:hover {
            background: var(--bg-hover);
            color: var(--fg);
            border-color: var(--border-h)
        }

        .pn-close svg {
            width: 16px;
            height: 16px
        }

        .pn-body {
            padding: 28px 24px 40px
        }

        .pn-preview {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 120px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 20px
        }

        .pn-preview icon-ic {
            font-size: 4rem;
            line-height: 1
        }

        .pn-name {
            font-size: 1.15rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            margin-bottom: 24px;
            color: var(--fg);
            word-break: break-all
        }

        .pn-section {
            margin-bottom: 24px
        }

        .pn-label {
            font-size: .7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--fg-muted);
            margin-bottom: 10px
        }

        .pn-code {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            overflow: hidden
        }

        .pn-code-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 14px;
            background: var(--bg);
            border-bottom: 1px solid var(--border)
        }

        .pn-code-lang {
            font-size: .68rem;
            color: var(--fg-muted);
            font-family: 'JetBrains Mono', monospace
        }

        .pn-copy {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--fg-muted);
            padding: 3px 10px;
            border-radius: 5px;
            font-family: inherit;
            font-size: .68rem;
            cursor: pointer;
            transition: all var(--tr)
        }

        .pn-copy:hover {
            border-color: var(--accent);
            color: var(--accent)
        }

        .pn-code pre {
            padding: 14px;
            font-family: 'JetBrains Mono', monospace;
            font-size: .78rem;
            line-height: 1.7;
            color: var(--fg-sec);
            overflow-x: auto;
            white-space: pre;
            margin: 0
        }

        .pn-code pre .t {
            color: #fb923c
        }

        .pn-code pre .a {
            color: #fbbf24
        }

        .pn-code pre .s {
            color: #4ade80
        }

        .pn-code pre .c {
            color: #52525b;
            font-style: italic
        }

        /* Size/Anim/Transform demo rows in panel */
        .pn-demo-row {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            padding: 14px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm)
        }

        .pn-demo-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px
        }

        .pn-demo-item icon-ic {
            line-height: 1
        }

        .pn-demo-tag {
            font-size: .58rem;
            font-family: 'JetBrains Mono', monospace;
            color: var(--fg-muted);
            background: var(--bg);
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid var(--border)
        }

        /* ===== TOAST ===== */
        .toast-wrap {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            pointer-events: none
        }

        .toast-msg {
            background: var(--bg-card);
            border: 1px solid var(--success);
            color: var(--success);
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            font-size: .82rem;
            font-weight: 500;
            box-shadow: 0 8px 32px rgba(0, 0, 0, .4);
            animation: toastIn .3s ease, toastOut .3s ease 1.5s forwards;
            pointer-events: auto;
            white-space: nowrap
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(12px) scale(.95)
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1)
            }
        }

        @keyframes toastOut {
            to {
                opacity: 0;
                transform: translateY(-8px) scale(.95)
            }
        }

        /* ===== RESPONSIVE ===== */
        @media(max-width:900px) {
            :root {
                --sidebar-w: 0px;
                --panel-w: 100vw
            }

            .sidebar {
                display: none
            }

            .nav-ver {
                display: none
            }
        }

        @media(max-width:600px) {
            .ic-grid {
                grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
                gap: 6px
            }

            .ic-card {
                padding: 12px 6px 10px
            }

            .ic-card icon-ic {
                font-size: 1.3rem
            }

            .ic-name {
                font-size: .52rem
            }

            .main {
                padding: 16px 12px
            }
        }

        @media(prefers-reduced-motion:reduce) {

            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                transition-duration: .01ms !important
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-logo">
            <div class="nav-logo-box">

    <!-- LAYOUT -->

        </aside>

        <!-- MAIN -->
        <main class="main" id="mainArea">

            </div>
            <div class="ic-grid" id="icGrid"></div>
        </main>
    </div>

    <!-- OVERLAY -->
    <div class="overlay" id="overlay"></div>

    <!-- DETAIL PANEL -->
    <div class="panel" id="panel">
        <button class="pn-close" id="panelClose" aria-label="Close panel">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
        </button>
        <div class="pn-body" id="panelBody"></div>
    </div>

    <!-- TOAST -->
    <div class="toast-wrap" id="toastWrap"></div>

    <!-- ============================================================
     ICONIC LIBRARY JS
     Production: remove this <script> block, uncomment:
     <script src="script.js"></script>
     ============================================================ -->
    <script>
        (function () {
            'use strict';

            // ===== Parse icon names from the library CSS =====
            const cssText = document.getElementById('iconic-css').textContent;
            const iconNames = [];
            const rx = /\.icon-([a-z0-9-]+)::after/g;
            let m;
            while ((m = rx.exec(cssText)) !== null) iconNames.push(m[1]);

            // ===== Category detection =====
            const catKW = {
                'Brands': ['google', 'facebook', 'github', 'gitlab', 'discord', 'dribbble', 'behance', 'figma', 'amazon', 'apple', 'android', 'chrome', 'firefox', 'edge', 'linux', 'docker', 'aws', 'angular', 'flutter', 'bandcamp', 'bitbucket', 'bootstrap', 'codepen', 'deviantart', 'dropbox', 'elementor', 'envira', 'erlang', 'etsy', 'font-awesome', 'forgejo', 'fort-awesome', 'forumbee', 'foursquare', 'free-code-camp', 'freebsd', 'fulcrum', 'galactic', 'gofore', 'golang', 'goodreads', 'grav', 'grunt', 'gulp', 'hacker-news', 'hackerrank', 'hooli', 'hotjar', 'hubspot', 'imdb', 'instagram', 'itunes', 'jira', 'joget', 'joomla', 'js', 'jsfiddle', 'julia', 'kaggle', 'keybase', 'kickstarter', 'lastfm', 'leanpub', 'leetcode', 'less', 'letterboxd', 'line', 'linkedin', 'linode', 'laravel', 'mailchimp', 'mandalorian', 'markdown', '500px', 'adn', 'algolia', 'angellist', 'artstation', 'asymmetrik', 'atlassian', 'audible', 'autoprefixer', 'avianex', 'aviato', 'battle-net', 'bilibili', 'bimobject', 'blender', 'blogger', 'bluesky', 'bluetooth', 'board-game', 'btc', 'buffer', 'buromobelexperte', 'buy-n-large', 'buysellads', 'canadian', 'cash-app', 'centercode', 'centos', 'chromecast', 'cloudflare', 'cloudscale', 'cloudsmith', 'cloudversify', 'cmplid', 'codiepie', 'confluence', 'connectdevelop', 'contao', 'cotton-bureau', 'cpanel', 'creative-commons', 'critical-role', 'css', 'css3', 'cuttlefish', 'd-and-d', 'dailymotion', 'dashcube', 'debian', 'deezer', 'delicious', 'deploydog', 'deskpro', 'dev', 'devpost', 'dharmachakra', 'dhl', 'diaspora', 'digg', 'digital-ocean', 'discourse', 'disqus', 'draft2digital', 'earlybirds', 'ebay', 'edge-legacy', 'eleventy', 'ello', 'ember', 'empire', 'expeditedssl', 'fantasy-flight', 'fedex', 'fediverse', 'fedora', 'ferry', 'first-order', 'firstdraft', 'fish-fins', 'flask', 'flickr', 'flipboard', 'floppy-disk', 'fonticons', 'gripfire', 'guilded', 'hire-a-helper', 'hive', 'hornbill', 'houzz', 'html5', 'hugging-face', 'ideal', 'instalod', 'intercom', 'internet-archive', 'internet-explorer', 'invision', 'ioxhost', 'island-tropical', 'itch-io', 'itunes-note', 'jar-wheat', 'java', 'jedi-order', 'jenkins', 'jet-fighter', 'jxl', 'kakao-talk', 'keycdn', 'kickstarter-k', 'kitchen-set', 'ko-fi', 'korvue', 'kubernetes', 'lake', 'lets-encrypt', 'lightbulb', 'lumon', 'lyft', 'magento'],
                'Arrows': ['arrow', 'angle', 'chevron', 'caret', 'location-arrow'],
                'Calendar': ['calendar'],
                'Charts': ['chart', 'gauge'],
                'Chat': ['comment', 'comments'],
                'Cloud': ['cloud'],
                'Code': ['code', 'file-code', 'markdown'],
                'Currency': ['dollar', 'euro', 'cent', 'bitcoin', 'ethereum', 'btc', 'credit-card', 'cc-', 'cash-app', 'google-pay', 'apple-pay', 'amazon-pay'],
                'Files': ['file', 'folder', 'archive', 'copy', 'clipboard', 'clone', 'download'],
                'Hands': ['hand', 'hands', 'handshake'],
                'Faces': ['face-'],
                'Animals': ['cat', 'dog', 'fish', 'frog', 'crow', 'hippo', 'horse', 'kiwi-bird', 'dragon', 'dove', 'bone', 'feather'],
                'Food & Drink': ['carrot', 'bowl', 'bottle', 'beer', 'hamburger', 'lemon', 'apple-whole', 'grapes', 'kitchen', 'fork-knife', 'flask'],
                'Health': ['heart', 'heartbeat', 'heart-pulse', 'lungs', 'capsules', 'bandage', 'dna'],
                'Buildings': ['home', 'house', 'building', 'hotel', 'hospital', 'church', 'igloo', 'campground', 'island-tropical', 'landmark'],
                'Media': ['film', 'compact-disc', 'backward', 'forward'],
                'Nature': ['leaf', 'clover', 'lake', 'cannabis', 'fire', 'flower'],
                'Security': ['lock', 'key', 'shield', 'eye', 'eye-slash'],
                'Shopping': ['cart', 'basket'],
                'Transport': ['car', 'bus', 'ferry', 'helicopter', 'jet-fighter', 'forklift'],
                'Weather': ['cloud-sun', 'cloud-rain', 'cloud-showers', 'cloud-meatball', 'cloud-arrow'],
                'Objects': ['bell', 'book', 'bomb', 'box', 'brain', 'calculator', 'camera', 'chair', 'clock', 'compass', 'cross', 'diamond', 'door', 'droplet', 'ear', 'eraser', 'fax', 'flag', 'gavel', 'gear', 'gears', 'ghost', 'globe', 'graduation', 'hammer', 'hard-drive', 'headphones', 'hexagon', 'hourglass', 'image', 'images', 'inbox', 'industry', 'jar', 'journal', 'knife', 'link', 'list', 'location-dot', 'map', 'magnifying'],
            };

            function categorize(n) {
                for (const [c, kws] of Object.entries(catKW))
                    for (const kw of kws) if (n.includes(kw)) return c;
                return 'Other';
            }

            // Build category map
            const cats = {};
            iconNames.forEach(n => { const c = categorize(n); if (!cats[c]) cats[c] = []; cats[c].push(n) });
            const sortedCats = Object.entries(cats).sort((a, b) => b[1].length - a[1].length);

            // ===== DOM refs =====
            const searchInput = document.getElementById('searchInput');
            const navBadge = document.getElementById('navBadge');
            const sidebarList = document.getElementById('sidebarList');
            const mainTitle = document.getElementById('mainTitle');
            const countInline = document.getElementById('countInline');
            const icGrid = document.getElementById('icGrid');
            const overlay = document.getElementById('overlay');
            const panel = document.getElementById('panel');
            const panelClose = document.getElementById('panelClose');
            const panelBody = document.getElementById('panelBody');
            const toastWrap = document.getElementById('toastWrap');

            let activeCat = 'All';
            let selectedIcon = null;

            // ===== Init badge =====
            navBadge.textContent = iconNames.length + ' icons';

            // ===== Build sidebar =====
            function buildSidebar() {
                let html = `<div class="sb-item active" data-cat="All">All<span class="sb-count">${iconNames.length}</span></div>`;
                sortedCats.forEach(([c, arr]) => {
                    html += `<div class="sb-item" data-cat="${c}">${c}<span class="sb-count">${arr.length}</span></div>`;
                });
                sidebarList.innerHTML = html;
            }
            buildSidebar();

            // ===== Render grid =====
            function renderGrid(filter = '', cat = 'All') {
                icGrid.innerHTML = '';
                const fl = filter.toLowerCase();
                let count = 0;
                const frag = document.createDocumentFragment();

                for (const name of iconNames) {
                    const ms = !fl || name.includes(fl);
                    const mc = cat === 'All' || categorize(name) === cat;
                    if (!ms || !mc) continue;
                    count++;
                    const card = document.createElement('div');
                    card.className = 'ic-card';
                    card.dataset.name = name;
                    if (name === selectedIcon) card.classList.add('selected');
                    card.innerHTML = `<icon-ic class="icon-${name}"></icon-ic><span class="ic-name">icon-${name}</span>`;
                    card.addEventListener('click', () => openPanel(name));
                    frag.appendChild(card);
                }

                if (count === 0) {
                    const empty = document.createElement('div');
                    empty.className = 'empty';
                    empty.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg><h3>No icons found</h3><p>Try a different search or category</p>`;
                    frag.appendChild(empty);
                }

                icGrid.appendChild(frag);
                countInline.textContent = count;
                const catLabel = cat === 'All' ? 'All Icons' : cat;
                mainTitle.innerHTML = `${catLabel} <b>${count}</b>`;
            }
            renderGrid();

            // ===== Sidebar click =====
            sidebarList.addEventListener('click', e => {
                const item = e.target.closest('.sb-item');
                if (!item) return;
                activeCat = item.dataset.cat;
                sidebarList.querySelectorAll('.sb-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                renderGrid(searchInput.value.trim(), activeCat);
            });

            // ===== Search =====
            searchInput.addEventListener('input', () => renderGrid(searchInput.value.trim(), activeCat));

            // ===== Detail Panel =====
            function openPanel(name) {
                selectedIcon = name;
                // Update card selection
                icGrid.querySelectorAll('.ic-card').forEach(c => {
                    c.classList.toggle('selected', c.dataset.name === name);
                });

                const code = `<icon-ic class="icon-${name}"></icon-ic>`;
                const cdnCode = `<link rel="stylesheet"\n  href="https://your-cdn.com/iconic/iconic.css">`;

                panelBody.innerHTML = `
      <div class="pn-preview"><icon-ic class="icon-${name}"></icon-ic></div>
      <div class="pn-name">icon-${name}</div>

      <div class="pn-section">
        <div class="pn-label">Usage</div>
        <div class="pn-code">
          <div class="pn-code-head"><span class="pn-code-lang">HTML</span><button class="pn-copy" data-text="${code}">Copy</button></div>
          <pre><span class="t">&lt;icon-ic</span> <span class="a">class</span>=<span class="s">"icon-${name}"</span><span class="t">&gt;&lt;/icon-ic&gt;</span></pre>
        </div>
      </div>

      <div class="pn-section">
        <div class="pn-label">CDN</div>
        <div class="pn-code">
          <div class="pn-code-head"><span class="pn-code-lang">HTML</span><button class="pn-copy" data-text='${cdnCode}'>Copy</button></div>
          <pre><span class="c">&lt;!-- Add to &lt;head&gt; --&gt;</span>
<span class="t">&lt;link</span> <span class="a">rel</span>=<span class="s">"stylesheet"</span>
  <span class="a">href</span>=<span class="s">"https://your-cdn.com/iconic/iconic.css"</span><span class="t">&gt;</span></pre>
        </div>
      </div>

      <div class="pn-section">
        <div class="pn-label">Sizes</div>
        <div class="pn-demo-row">
          <div class="pn-demo-item"><icon-ic class="icon-${name} icon-xs"></icon-ic><span class="pn-demo-tag">xs</span></div>
          <div class="pn-demo-item"><icon-ic class="icon-${name} icon-sm"></icon-ic><span class="pn-demo-tag">sm</span></div>
          <div class="pn-demo-item"><icon-ic class="icon-${name} icon-md"></icon-ic><span class="pn-demo-tag">md</span></div>
          <div class="pn-demo-item"><icon-ic class="icon-${name} icon-lg"></icon-ic><span class="pn-demo-tag">lg</span></div>
          <div class="pn-demo-item"><icon-ic class="icon-${name} icon-xl"></icon-ic><span class="pn-demo-tag">xl</span></div>
          <div class="pn-demo-item"><icon-ic class="icon-${name} icon-2x"></icon-ic><span class="pn-demo-tag">2x</span></div>
          <div class="pn-demo-item"><icon-ic class="icon-${name} icon-3x"></icon-ic><span class="pn-demo-tag">3x</span></div>
        </div>
      </div>

      <div class="pn-section">
        <div class="pn-label">Animations</div>
        <div class="pn-demo-row">
          <div class="pn-demo-item"><icon-ic class="icon-${name} icon-spin" style="font-size:1.4rem"></icon-ic><span class="pn-demo-tag">spin</span></div>
          <div class="pn-demo-item"><icon-ic class="icon-${name} icon-pulse" style="font-size:1.4rem"></icon-ic><span class="pn-demo-tag">pulse</span></div>
          <div class="pn-demo-item"><icon-ic class="icon-${name} icon-bounce" style="font-size:1.4rem"></icon-ic><span class="pn-demo-tag">bounce</span></div>
          <div class="pn-demo-item"><icon-ic class="icon-${name} icon-beat" style="font-size:1.4rem"></icon-ic><span class="pn-demo-tag">beat</span></div>
          <div class="pn-demo-item"><icon-ic class="icon-${name} icon-fade" style="font-size:1.4rem"></icon-ic><span class="pn-demo-tag">fade</span></div>
          <div class="pn-demo-item"><icon-ic class="icon-${name} icon-shake" style="font-size:1.4rem"></icon-ic><span class="pn-demo-tag">shake</span></div>
        </div>
      </div>

      <div class="pn-section">
        <div class="pn-label">Transforms</div>
        <div class="pn-demo-row">
          <div class="pn-demo-item"><icon-ic class="icon-${name} icon-rotate-90" style="font-size:1.4rem"></icon-ic><span class="pn-demo-tag">90</span></div>
          <div class="pn-demo-item"><icon-ic class="icon-${name} icon-rotate-180" style="font-size:1.4rem"></icon-ic><span class="pn-demo-tag">180</span></div>
          <div class="pn-demo-item"><icon-ic class="icon-${name} icon-rotate-270" style="font-size:1.4rem"></icon-ic><span class="pn-demo-tag">270</span></div>
          <div class="pn-demo-item"><icon-ic class="icon-${name} icon-flip-horizontal" style="font-size:1.4rem"></icon-ic><span class="pn-demo-tag">flipH</span></div>
          <div class="pn-demo-item"><icon-ic class="icon-${name} icon-flip-vertical" style="font-size:1.4rem"></icon-ic><span class="pn-demo-tag">flipV</span></div>
          <div class="pn-demo-item"><icon-ic class="icon-${name} icon-flip-both" style="font-size:1.4rem"></icon-ic><span class="pn-demo-tag">flipB</span></div>
        </div>
      </div>
    `;

                // Wire copy buttons inside panel
                panelBody.querySelectorAll('.pn-copy').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const txt = btn.dataset.text;
                        navigator.clipboard.writeText(txt).then(() => {
                            btn.textContent = 'Copied!';
                            toast('Copied to clipboard');
                            setTimeout(() => btn.textContent = 'Copy', 1200);
                        }).catch(() => {
                            const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
                            toast('Copied to clipboard');
                        });
                    });
                });

                panel.classList.add('show');
                overlay.classList.add('show');
            }

            function closePanel() {
                panel.classList.remove('show');
                overlay.classList.remove('show');
                selectedIcon = null;
                icGrid.querySelectorAll('.ic-card.selected').forEach(c => c.classList.remove('selected'));
            }

            panelClose.addEventListener('click', closePanel);
            overlay.addEventListener('click', closePanel);
            document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel() });

            // ===== Toast =====
            function toast(msg) {
                const t = document.createElement('div');
                t.className = 'toast-msg'; t.textContent = msg;
                toastWrap.appendChild(t);
                setTimeout(() => t.remove(), 2000);
            }

        })();
    </script>

</body>

</html>
