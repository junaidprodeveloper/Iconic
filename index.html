<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICONIC — Icon Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="iconic.css">
    <style>
:root{--bg-deep:#09090b;--bg:#0f0f12;--bg-surface:#161619;--bg-card:#1c1c20;--bg-hover:#242429;--fg:#f0f0f2;--fg-sec:#a0a0aa;--fg-muted:#5c5c66;--accent:#f97316;--accent-h:#ea580c;--accent-soft:rgba(249,115,22,.07);--accent-glow:rgba(249,115,22,.2);--success:#22c55e;--border:#222228;--border-h:#333340;--radius:10px;--radius-sm:7px;--tr:.2s cubic-bezier(.4,0,.2,1);--sidebar-w:230px;--navbar-h:60px;--panel-w:380px}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scrollbar-width:thin;scrollbar-color:var(--border-h) transparent}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;overflow:hidden;height:100vh}
.navbar{position:fixed;top:0;left:0;right:0;height:var(--navbar-h);background:var(--bg-deep);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:16px;z-index:100}
.navbar::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent-glow),transparent);pointer-events:none}
.nav-logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
.nav-logo-box{width:34px;height:34px;background:linear-gradient(135deg,var(--accent),#fb923c);border-radius:9px;display:flex;align-items:center;justify-content:center}
.nav-logo-box svg{width:18px;height:18px;color:#fff}
.nav-logo-text{font-size:1.15rem;font-weight:800;letter-spacing:-.03em;color:var(--fg)}
.nav-logo-text span{color:var(--accent)}
.nav-search{flex:1;max-width:480px;position:relative}
.nav-search input{width:100%;padding:9px 14px 9px 38px;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--fg);font-family:inherit;font-size:.875rem;outline:none;transition:all var(--tr)}
.nav-search input::placeholder{color:var(--fg-muted)}
.nav-search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.nav-search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--fg-muted);pointer-events:none}
.nav-badge{background:var(--accent-soft);color:var(--accent);font-size:.75rem;font-weight:600;padding:4px 12px;border-radius:20px;border:1px solid rgba(249,115,22,.15);white-space:nowrap;font-family:'JetBrains Mono',monospace}
.nav-ver{font-size:.7rem;color:var(--fg-muted);margin-left:auto;flex-shrink:0}
.layout{display:flex;height:100vh;padding-top:var(--navbar-h)}
.sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--bg-deep);border-right:1px solid var(--border);overflow-y:auto;padding:16px 0;scrollbar-width:thin;scrollbar-color:var(--border-h) transparent}
.sidebar-label{font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--fg-muted);padding:12px 20px 8px}
.sb-item{display:flex;align-items:center;justify-content:space-between;padding:8px 20px;cursor:pointer;transition:all var(--tr);border-left:3px solid transparent;color:var(--fg-sec);font-size:.85rem;font-weight:500}
.sb-item:hover{background:var(--bg-surface);color:var(--fg)}
.sb-item.active{background:var(--accent-soft);color:var(--accent);border-left-color:var(--accent)}
.sb-count{font-size:.7rem;font-family:'JetBrains Mono',monospace;color:var(--fg-muted);background:var(--bg-surface);padding:1px 7px;border-radius:10px}
.sb-item.active .sb-count{background:rgba(249,115,22,.12);color:var(--accent)}
.main{flex:1;overflow-y:auto;padding:24px;scroll-behavior:smooth}
.main-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.main-title{font-size:1.1rem;font-weight:600}
.main-title b{color:var(--accent);font-family:'JetBrains Mono',monospace;font-weight:700}
.ic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px}
.ic-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;transition:all var(--tr);position:relative;content-visibility:auto;contain-intrinsic-size:0 90px}
.ic-card::before{content:'';position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at 50% 30%,var(--accent-soft),transparent 70%);opacity:0;transition:opacity var(--tr);pointer-events:none}
.ic-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.ic-card:hover::before{opacity:1}
.ic-card:active{transform:scale(.96)}
.ic-card.selected{border-color:var(--accent);background:var(--accent-soft)}
.ic-card icon-ic{font-size:1.6rem;color:var(--fg-sec);transition:color var(--tr);line-height:1}
.ic-card:hover icon-ic{color:var(--fg)}
.ic-name{font-size:.58rem;font-family:'JetBrains Mono',monospace;color:var(--fg-muted);text-align:center;line-height:1.25;word-break:break-all;max-height:2.5em;overflow:hidden;transition:color var(--tr)}
.ic-card:hover .ic-name{color:var(--fg-sec)}
.empty{grid-column:1/-1;text-align:center;padding:80px 20px;color:var(--fg-muted)}
.empty svg{width:48px;height:48px;margin-bottom:12px;opacity:.3}
.empty h3{font-size:1rem;color:var(--fg-sec);font-weight:500;margin-bottom:4px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;opacity:0;pointer-events:none;transition:opacity .3s ease}
.overlay.show{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:var(--panel-w);background:var(--bg-deep);border-left:1px solid var(--border);z-index:201;transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border-h) transparent}
.panel.show{transform:translateX(0)}
.pn-close{position:absolute;top:16px;right:16px;width:32px;height:32px;background:var(--bg-surface);border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--fg-muted);transition:all var(--tr);z-index:5}
.pn-close:hover{background:var(--bg-hover);color:var(--fg);border-color:var(--border-h)}
.pn-close svg{width:16px;height:16px}
.pn-body{padding:28px 24px 40px}
.pn-preview{display:flex;align-items:center;justify-content:center;height:120px;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:20px}
.pn-preview icon-ic{font-size:4rem;line-height:1}
.pn-name{font-size:1.15rem;font-weight:700;font-family:'JetBrains Mono',monospace;margin-bottom:24px;color:var(--fg);word-break:break-all}
.pn-section{margin-bottom:24px}
.pn-label{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-muted);margin-bottom:10px}
.pn-code{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden}
.pn-code-head{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:var(--bg);border-bottom:1px solid var(--border)}
.pn-code-lang{font-size:.68rem;color:var(--fg-muted);font-family:'JetBrains Mono',monospace}
.pn-copy{background:transparent;border:1px solid var(--border);color:var(--fg-muted);padding:3px 10px;border-radius:5px;font-family:inherit;font-size:.68rem;cursor:pointer;transition:all var(--tr)}
.pn-copy:hover{border-color:var(--accent);color:var(--accent)}
.pn-code pre{padding:14px;font-family:'JetBrains Mono',monospace;font-size:.78rem;line-height:1.7;color:var(--fg-sec);overflow-x:auto;white-space:pre;margin:0}
.pn-code pre .t{color:#fb923c}.pn-code pre .a{color:#fbbf24}.pn-code pre .s{color:#4ade80}.pn-code pre .c{color:#52525b;font-style:italic}
.pn-demo-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-sm)}
.pn-demo-item{display:flex;flex-direction:column;align-items:center;gap:6px}
.pn-demo-item icon-ic{line-height:1}
.pn-demo-tag{font-size:.58rem;font-family:'JetBrains Mono',monospace;color:var(--fg-muted);background:var(--bg);padding:2px 6px;border-radius:4px;border:1px solid var(--border)}
.toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast-msg{background:var(--bg-card);border:1px solid var(--success);color:var(--success);padding:10px 20px;border-radius:var(--radius-sm);font-size:.82rem;font-weight:500;box-shadow:0 8px 32px rgba(0,0,0,.4);animation:toastIn .3s ease,toastOut .3s ease 1.5s forwards;pointer-events:auto;white-space:nowrap}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes toastOut{to{opacity:0;transform:translateY(-8px) scale(.95)}}
@media(max-width:900px){:root{--sidebar-w:0px;--panel-w:100vw}.sidebar{display:none}.nav-ver{display:none}}
@media(max-width:600px){.ic-grid{grid-template-columns:repeat(auto-fill,minmax(85px,1fr));gap:6px}.ic-card{padding:12px 6px 10px}.ic-card icon-ic{font-size:1.3rem}.ic-name{font-size:.52rem}.main{padding:16px 12px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
    </style>
</head>
<body>

<nav class="navbar">
  <div class="nav-logo">
    <div class="nav-logo-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></div>
    <div class="nav-logo-text">ICONIC<span>.</span></div>
  </div>
  <div class="nav-search">
    <input type="text" id="searchInput" placeholder="Search 1400+ icons..." aria-label="Search icons">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
  </div>
  <div class="nav-badge" id="navBadge">0 icons</div>
  <div class="nav-ver">v1.0.0</div>
</nav>

<div class="layout">
  <aside class="sidebar" id="sidebar"><div class="sidebar-label">Categories</div><div id="sidebarList"></div></aside>
  <main class="main" id="mainArea">
    <div class="main-head"><div class="main-title" id="mainTitle">All Icons <b id="countInline">0</b></div></div>
    <div class="ic-grid" id="icGrid"></div>
  </main>
</div>

<div class="overlay" id="overlay"></div>
<div class="panel" id="panel">
  <button class="pn-close" id="panelClose" aria-label="Close panel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
  <div class="pn-body" id="panelBody"></div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script src="script.js"></script>
</body>
</html>
