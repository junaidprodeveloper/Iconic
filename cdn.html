<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iconic - CDN </title>
    <link rel="stylesheet" href="iconic.css">
    <link rel="stylesheet" href="iconic.min.css">
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #050505;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.logo {
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    white-space: pre;
    font-family: "JetBrains Mono", "Courier New", monospace;
    font-size: clamp(8px, 1.8vw, 28px);
    line-height: 1.15;
    letter-spacing: 2px;

    color: #fff;
    text-shadow:
        0 0 10px #6366f1,
        0 0 30px #6366f1;

    animation:
        iconic-expand 2s cubic-bezier(.16,1,.3,1) forwards,
        iconic-crumble 5s 3s infinite;
}


/* Expand from small to fullscreen */
@keyframes iconic-expand {

    0% {
        transform: scale(0.05);
        opacity: 0;
        filter: blur(20px);
    }

    60% {
        opacity: 1;
        filter: blur(0);
    }

    100% {
        transform: scale(1);
        opacity: 1;
    }
}


/* crumble effect */
@keyframes iconic-crumble {

    0%,80% {
        transform:
            translateY(0)
            rotate(0deg);

        opacity:1;
        filter:
            blur(0);
    }


    90% {

        transform:
            translateY(20px)
            rotate(2deg);

        filter:
            blur(2px);

        opacity:.7;
    }


    100% {

        transform:
            translateY(100vh)
            rotate(15deg);

        opacity:0;

        filter:
            blur(15px);
    }
}
    </style>
</head>
<body>
    <div class="logo"></div>
</body>
</html>
