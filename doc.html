<style id="doc-styles">
:root{
  --bg:#ffffff; --fg:#1b1b1b; --muted:#5c5c66; --border:#e6e6ea;
  --sidebar-bg:#fafafc; --card:#ffffff; --code-bg:#f5f5f8; --code-fg:#0b0b0f;
  --accent:#0b5fff; --accent-fg:#ffffff; --chip:#eef2ff; --chip-fg:#1e3a8a;
  --header-h:56px; --sidebar-w:280px; --toc-w:240px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.04);
}
html.dark{
  --bg:#0e0f13; --fg:#e7e8ea; --muted:#9095a1; --border:#242731;
  --sidebar-bg:#12141a; --card:#161923; --code-bg:#0b0d13; --code-fg:#e2e6ef;
  --accent:#7ea8ff; --accent-fg:#08111f; --chip:#1c2540; --chip-fg:#c8d6ff;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);font-family:var(--font);scroll-behavior:smooth}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
code,pre{font-family:var(--mono)}
button{font-family:inherit;cursor:pointer}

/* Header */
.doc-header{position:sticky;top:0;z-index:50;height:var(--header-h);display:flex;align-items:center;gap:12px;
  padding:0 16px;background:var(--bg);border-bottom:1px solid var(--border)}
.doc-header .brand{font-weight:700;font-size:15px;letter-spacing:.2px}
.doc-header .brand span{color:var(--accent)}
.doc-header .search{flex:1;max-width:560px;margin:0 auto}
.doc-header .search input{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;
  background:var(--sidebar-bg);color:var(--fg);font-size:14px;outline:none}
.doc-header .search input:focus{border-color:var(--accent)}
.doc-header .actions{display:flex;gap:8px;align-items:center}
.doc-header button.icon-btn{background:transparent;border:1px solid var(--border);color:var(--fg);
  border-radius:8px;padding:6px 10px;font-size:13px}
.doc-header button.icon-btn:hover{background:var(--sidebar-bg)}
.menu-toggle{display:none}
@media (max-width:900px){.menu-toggle{display:inline-flex}}

/* Layout */
.doc-layout{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr) var(--toc-w);
  min-height:calc(100vh - var(--header-h))}
@media (max-width:1200px){.doc-layout{grid-template-columns:var(--sidebar-w) minmax(0,1fr)}
  .doc-toc{display:none}}
@media (max-width:900px){.doc-layout{grid-template-columns:minmax(0,1fr)}
  .doc-sidebar{position:fixed;left:0;top:var(--header-h);bottom:0;width:280px;transform:translateX(-100%);
    transition:transform .2s;z-index:40}
  .doc-sidebar.open{transform:translateX(0)}}

.doc-sidebar{background:var(--sidebar-bg);border-right:1px solid var(--border);
  position:sticky;top:var(--header-h);align-self:start;height:calc(100vh - var(--header-h));overflow:auto;padding:16px 8px}
.doc-sidebar h4{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
  margin:14px 12px 6px}
.cat-list{display:flex;flex-direction:column;gap:2px}
.cat-list button{display:flex;justify-content:space-between;align-items:center;gap:8px;
  width:100%;text-align:left;padding:7px 12px;border-radius:6px;border:none;
  background:transparent;color:var(--fg);font-size:13.5px}
.cat-list button:hover{background:var(--border)}
.cat-list button.active{background:var(--chip);color:var(--chip-fg);font-weight:600}
.cat-list .count{font-size:11px;color:var(--muted);background:transparent;padding:1px 6px;border-radius:10px}
.cat-list button.active .count{color:var(--chip-fg)}

.doc-main{padding:28px 36px;min-width:0}
@media (max-width:700px){.doc-main{padding:20px 16px}}
.doc-main h1{font-size:32px;margin:0 0 8px;letter-spacing:-.01em}
.doc-main .lede{color:var(--muted);margin:0 0 22px;font-size:15px}
.stat-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.stat{background:var(--sidebar-bg);border:1px solid var(--border);border-radius:8px;
  padding:8px 12px;font-size:12.5px;color:var(--muted)}
.stat b{color:var(--fg);font-weight:600}

.section-title{margin:24px 0 10px;font-size:22px;letter-spacing:-.01em;
  display:flex;align-items:baseline;gap:10px}
.section-title small{color:var(--muted);font-size:13px;font-weight:400}

.card{background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:6px}
.card h3{margin:0;font-size:16.5px;font-family:var(--mono);word-break:break-all}
.card .btns{display:flex;gap:6px;flex-wrap:wrap}
.card .btns button{background:var(--sidebar-bg);border:1px solid var(--border);color:var(--fg);
  border-radius:6px;padding:4px 9px;font-size:12px}
.card .btns button:hover{background:var(--chip);color:var(--chip-fg)}
.card p.desc{margin:4px 0 10px;color:var(--muted);font-size:14px}
.card .label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:10px 0 4px}
.card pre{background:var(--code-bg);color:var(--code-fg);padding:10px 12px;border-radius:8px;
  overflow:auto;font-size:12.5px;margin:0;line-height:1.5;border:1px solid var(--border)}
.card .preview{background:repeating-linear-gradient(45deg,var(--sidebar-bg) 0 10px,transparent 10px 20px);
  border:1px dashed var(--border);border-radius:8px;padding:16px;min-height:64px;display:flex;
  align-items:center;justify-content:center;overflow:hidden}
.card .preview .demo{display:inline-block;padding:10px 16px;background:var(--chip);color:var(--chip-fg);
  border-radius:6px;font-size:14px}
.card .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:700px){.card .grid2{grid-template-columns:1fr}}

/* TOC */
.doc-toc{border-left:1px solid var(--border);position:sticky;top:var(--header-h);
  align-self:start;height:calc(100vh - var(--header-h));overflow:auto;padding:20px 14px;font-size:13px}
.doc-toc h5{margin:0 0 8px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.doc-toc a{display:block;padding:3px 6px;border-radius:4px;color:var(--fg);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-toc a:hover{background:var(--sidebar-bg);text-decoration:none}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);
  padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:100}
.toast.show{opacity:1}

.pager{display:flex;gap:8px;justify-content:center;margin:16px 0 6px;flex-wrap:wrap}
.pager button{background:var(--sidebar-bg);border:1px solid var(--border);color:var(--fg);
  border-radius:6px;padding:6px 12px;font-size:13px}
.pager button.active{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.pager button:disabled{opacity:.4;cursor:not-allowed}
.empty{color:var(--muted);padding:40px;text-align:center;border:1px dashed var(--border);border-radius:12px}
</style>

}

  position:absolute;
  content:"";
  height:clamp(18px,2.3vw,22px);

  left:clamp(2px,0.3vw,3px);

   ============================================ */

.ic-bg-gradient-peach{background:linear-gradient(135deg,#fecaca,#fde68a)}
.ic-bg-gradient-sky{background:linear-gradient(135deg,#bae6fd,#e0f2fe)}

.ic-bg-gradient-to-b{background:linear-gradient(to bottom,var(--ic-from,#3b82f6),var(--ic-to,#8b5cf6))}
.ic-bg-gradient-to-tr{background:linear-gradient(to top right,var(--ic-from,#3b82f6),var(--ic-to,#8b5cf6))}
.ic-bg-gradient-to-tl{background:linear-gradient(to top left,var(--ic-from,#3b82f6),var(--ic-to,#8b5cf6))}
.ic-bg-gradient-to-br{background:linear-gradient(to bottom right,var(--ic-from,#3b82f6),var(--ic-to,#8b5cf6))}
.ic-bg-gradient-to-bl{background:linear-gradient(to bottom left,var(--ic-from,#3b82f6),var(--ic-to,#8b5cf6))}

</style>
</head>
<body>
<header class="doc-header">
  <button class="icon-btn menu-toggle" id="menu-toggle" aria-label="Toggle sidebar">☰</button>
  <div class="brand">Iconic <span>Framework</span> Docs</div>
  <div class="search"><input id="search" type="search" placeholder="Search classes… (e.g. btn, flex, rotate)" autocomplete="off"/></div>
  <div class="actions">
    <button class="icon-btn" id="theme-toggle" aria-label="Toggle theme">🌓</button>
    <a class="icon-btn" href="iconic-framework.css" download>CSS</a>
  </div>
</header>

<div class="doc-layout">
  <aside class="doc-sidebar" id="sidebar">
    <h4>Categories</h4>
    <div class="cat-list" id="cat-list"></div>
  </aside>
  <main class="doc-main" id="main">
    <h1 id="title">Iconic Framework</h1>
    <p class="lede" id="lede">Auto-generated reference for every class, utility, animation, and helper defined in <code>iconic-framework.css</code>.</p>
    <div class="stat-row" id="stat-row"></div>
    <div id="content"></div>
    <div class="pager" id="pager"></div>
  </main>
  <aside class="doc-toc" id="toc">
    <h5>On this page</h5>
    <div id="toc-list"></div>
  </aside>
</div>

<div class="toast" id="toast">Copied!</div>

<script id="raw-css" type="text/plain">/* CSS is applied above; parsing is done via document.styleSheets */</script>

<script>
(function(){
  const rawCss = document.getElementById('raw-css').textContent;

  // --- Parse: iterate the stylesheet we just injected ---
  const sheet = document.getElementById('iconic-css').sheet;
  const rules = [];      // {selector, cssText, props:{prop:value}, className}
  const keyframes = [];  // {name, cssText}

  function walk(list){
    for (const r of list){
      if (r.type === 1 /* STYLE_RULE */){
        const props = {};
        for (let i=0;i<r.style.length;i++){
          const p = r.style[i];
          props[p] = r.style.getPropertyValue(p);
        }
        rules.push({selector:r.selectorText, cssText:r.cssText, props});
      } else if (r.type === 7 /* KEYFRAMES */){
        keyframes.push({name:r.name, cssText:r.cssText});
      } else if (r.cssRules){
        walk(r.cssRules);
      }
    }
  }
  try { walk(sheet.cssRules); } catch(e){ console.error(e); }

  // --- Extract per-class entries (each class gets one card; selector variants shown) ---
  const byClass = new Map(); // className -> {name, selectors:[], props:{}, cssTexts:[]}
  const classRe = /\.([A-Za-z_][\w-]*)/g;
  for (const rule of rules){
    const parts = rule.selector.split(',').map(s=>s.trim());
    for (const p of parts){
      const matches = [...p.matchAll(classRe)].map(m=>m[1]);
      // Skip non-ic classes to keep it framework-focused
      const icClass = matches.find(c => c.startsWith('ic-') || c.startsWith('ic--'));
      if (!icClass) continue;
      if (!byClass.has(icClass)) byClass.set(icClass, {name:icClass, selectors:[], props:{}, cssTexts:[], variants:[]});
      const entry = byClass.get(icClass);
      entry.selectors.push(p);
      entry.cssTexts.push(rule.cssText);
      entry.variants.push({selector:p, props:rule.props, cssText:rule.cssText});
      // merge base (non-pseudo, exact .class) props as canonical
      if (p === '.'+icClass){
        Object.assign(entry.props, rule.props);
      }
    }
  }

  // --- Categorization ---
  const CATS = [
    ['Buttons',      c => /^ic-btn(\b|-)/.test(c)],
    ['Layout & Containers', c => /^ic-(container|row|col|section|wrap|content|main|header|footer|aside|hero|panel|page)(\b|-)/.test(c)],
    ['Flexbox',      c => /^ic-(flex|items|justify|content|self|order|basis|shrink|grow)(\b|-)/.test(c)],
    ['Grid',         c => /^ic-(grid|col-span|row-span|place|gap)(\b|-)/.test(c)],
    ['Spacing',      c => /^ic-(m|p|mt|mb|ml|mr|mx|my|pt|pb|pl|pr|px|py|margin|padding|space)(-|\b)/.test(c)],
    ['Sizing',       c => /^ic-(w|h|min-w|min-h|max-w|max-h|size|aspect)(\b|-)/.test(c)],
    ['Typography',   c => /^ic-(text|font|leading|tracking|whitespace|break|truncate|underline|italic|uppercase|lowercase|capitalize|indent|list|align)(\b|-)/.test(c)],
    ['Colors & Backgrounds', c => /^ic-(bg|text-color|from|via|to|fill|stroke|placeholder|caret|accent-color)(\b|-)/.test(c)],
    ['Borders & Radius', c => /^ic-(border|rounded|ring|outline|divide)(\b|-)/.test(c)],
    ['Effects & Filters', c => /^ic-(shadow|opacity|blur|brightness|contrast|grayscale|hue|invert|saturate|sepia|backdrop|mix-blend|isolation|drop-shadow)(\b|-)/.test(c)],
    ['Transforms',   c => /^ic--?(rotate|scale|skew|translate|transform|origin|perspective)(\b|-)/.test(c)],
    ['Transitions & Animations', c => /^ic-(animate|animation|transition|duration|delay|ease|motion)(\b|-)/.test(c)],
    ['Positioning',  c => /^ic-(absolute|relative|fixed|sticky|static|top|bottom|left|right|inset|z)(\b|-)/.test(c)],
    ['Display & Visibility', c => /^ic-(block|inline|hidden|show|visible|invisible|display|overflow|float|clear|object|table)(\b|-)/.test(c)],
    ['Interactivity',c => /^ic-(cursor|pointer-events|select|resize|scroll|snap|touch|user|will|appearance|caret|toggle)(\b|-)/.test(c)],
    ['Hover & State',c => /^ic-(hover|focus|active|group|disabled|checked)(\b|-)/.test(c)],
    ['Tables',       c => /^ic-(table)(\b|-)/.test(c)],
    ['Forms',        c => /^ic-(input|form|field|check|radio|switch|select|label|textarea)(\b|-)/.test(c)],
    ['Icons',        c => /^ic-(icon|ico)(\b|-)/.test(c)],
    ['Components',   c => /^ic-(card|modal|dropdown|tab|nav|badge|alert|tag|tooltip|popover|breadcrumb|pagination|progress|spinner|avatar|chip|accordion|collapse|carousel|toast|banner|stepper|timeline|menu|sidebar|drawer)(\b|-)/.test(c)],
    ['Helpers & Utilities', () => true], // catch-all
  ];

  const catBuckets = new Map(CATS.map(([n]) => [n, []]));
  const allClasses = [...byClass.values()].sort((a,b)=>a.name.localeCompare(b.name));
  for (const entry of allClasses){
    for (const [name, test] of CATS){
      if (test(entry.name)){ catBuckets.get(name).push(entry); break; }
    }
  }
  // Add animations bucket from keyframes
  const animBucket = catBuckets.get('Transitions & Animations');

  // --- Description inference ---
  function describe(entry){
    const p = entry.props;
    const bits = [];
    const map = {
      'display':'sets display', 'position':'sets position',
      'color':'sets text color', 'background-color':'sets background color', 'background':'sets background',
      'font-size':'sets font size','font-weight':'sets font weight','font-family':'sets font family',
      'line-height':'sets line height','letter-spacing':'sets letter spacing','text-align':'sets text alignment',
      'text-transform':'sets text transform','text-decoration':'sets text decoration',
      'margin':'sets margin','padding':'sets padding',
      'width':'sets width','height':'sets height','min-width':'sets min-width','max-width':'sets max-width',
      'border':'sets border','border-radius':'sets border radius',
      'box-shadow':'applies a box-shadow','opacity':'sets opacity','filter':'applies a filter',
      'transform':'applies a transform','transition':'defines a transition','animation':'runs an animation',
      'flex':'flex shorthand','flex-direction':'sets flex direction','justify-content':'sets justify-content',
      'align-items':'sets align-items','gap':'sets gap',
      'grid-template-columns':'defines grid columns','grid-template-rows':'defines grid rows',
      'overflow':'sets overflow','cursor':'sets cursor','z-index':'sets z-index',
    };
    for (const k of Object.keys(p)){
      if (map[k]) bits.push(map[k]+' to '+p[k]);
    }
    if (!bits.length){
      const keys = Object.keys(p).slice(0,3);
      if (keys.length) bits.push('applies '+keys.map(k=>k+': '+p[k]).join('; '));
      else bits.push('utility class defined by the framework.');
    }
    return bits.slice(0,3).join('; ')+'.';
  }

  // --- Rendering ---
  const catListEl = document.getElementById('cat-list');
  const contentEl = document.getElementById('content');
  const tocEl = document.getElementById('toc-list');
  const statRow = document.getElementById('stat-row');
  const pagerEl = document.getElementById('pager');
  const searchEl = document.getElementById('search');
  const toastEl = document.getElementById('toast');

  const totalRules = rules.length;
  const totalClasses = byClass.size;
  const totalKF = keyframes.length;
  statRow.innerHTML = [
    ['Classes', totalClasses],
    ['Rules', totalRules],
    ['@keyframes', totalKF],
    ['Categories', CATS.length + 1],
  ].map(([k,v]) => `<div class="stat"><b>${v.toLocaleString()}</b> ${k}</div>`).join('');

  // Build category list including Animations (@keyframes) and All
  const catRenderList = [
    {name:'All classes', entries:allClasses, kind:'classes'},
    ...CATS.map(([name])=>({name, entries:catBuckets.get(name), kind:'classes'})).filter(c=>c.entries.length),
    {name:'@keyframes', entries:keyframes, kind:'keyframes'},
  ];

  let activeCatIdx = 1; // start on first real category
  let currentPage = 1;
  const PAGE_SIZE = 60;
  let filter = '';

  function renderCatList(){
    catListEl.innerHTML = catRenderList.map((c,i)=>
      `<button data-i="${i}" class="${i===activeCatIdx?'active':''}">
        <span>${c.name}</span><span class="count">${c.entries.length}</span></button>`
    ).join('');
    catListEl.querySelectorAll('button').forEach(b=>{
      b.addEventListener('click',()=>{
        activeCatIdx = +b.dataset.i;
        currentPage = 1;
        renderCatList();
        render();
        document.getElementById('sidebar').classList.remove('open');
        window.scrollTo({top:0,behavior:'smooth'});
      });
    });
  }

  function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function formatCss(css){
    return css.replace(/\{/g,' {\n  ').replace(/;\s*/g,';\n  ').replace(/\n  \}/g,'\n}').replace(/\}\s*/g,'}\n');
  }

  function classCard(entry){
    const desc = describe(entry);
    const cssBlock = entry.variants.map(v=>formatCss(v.cssText)).join('\n');
    const htmlEx = `<div class="${entry.name}">Example</div>`;
    const safeName = entry.name.replace(/[^\w-]/g,'');
    return `<article class="card" id="c-${safeName}">
      <header>
        <h3>.${escapeHtml(entry.name)}</h3>
        <div class="btns">
          <button data-copy="${escapeHtml(entry.name)}">Copy class</button>
          <button data-copy-html="${escapeHtml(htmlEx)}">Copy HTML</button>
        </div>
      </header>
      <p class="desc">${escapeHtml(desc)}</p>
      <div class="grid2">
        <div>
          <div class="label">CSS</div>
          <pre>${escapeHtml(cssBlock)}</pre>
        </div>
        <div>
          <div class="label">HTML usage</div>
          <pre>${escapeHtml(htmlEx)}</pre>
          <div class="label" style="margin-top:10px">Live preview</div>
          <div class="preview"><div class="demo ${escapeHtml(entry.name)}">${escapeHtml(entry.name)}</div></div>
        </div>
      </div>
    </article>`;
  }

  function kfCard(kf){
    const safeName = kf.name.replace(/[^\w-]/g,'');
    return `<article class="card" id="c-kf-${safeName}">
      <header>
        <h3>@keyframes ${escapeHtml(kf.name)}</h3>
        <div class="btns">
          <button data-copy="${escapeHtml(kf.name)}">Copy name</button>
        </div>
      </header>
      <p class="desc">Keyframes animation defined by the framework. Reference via <code>animation-name: ${escapeHtml(kf.name)}</code>.</p>
      <div class="label">CSS</div>
      <pre>${escapeHtml(formatCss(kf.cssText))}</pre>
    </article>`;
  }

  function render(){
    const cat = catRenderList[activeCatIdx];
    let entries = cat.entries;
    if (filter){
      const f = filter.toLowerCase();
      entries = entries.filter(e => (e.name||'').toLowerCase().includes(f));
    }
    document.getElementById('title').textContent = cat.name;
    document.getElementById('lede').textContent =
      cat.kind === 'keyframes'
        ? `All ${entries.length.toLocaleString()} @keyframes rules defined in iconic-framework.css.`
        : `${entries.length.toLocaleString()} class${entries.length===1?'':'es'} in this category. Every entry is generated from the actual CSS source.`;

    // pagination
    const pages = Math.max(1, Math.ceil(entries.length / PAGE_SIZE));
    if (currentPage > pages) currentPage = 1;
    const start = (currentPage-1)*PAGE_SIZE;
    const slice = entries.slice(start, start+PAGE_SIZE);

    if (!slice.length){
      contentEl.innerHTML = `<div class="empty">No entries match “${escapeHtml(filter)}”.</div>`;
      tocEl.innerHTML = '';
      pagerEl.innerHTML = '';
      return;
    }
    contentEl.innerHTML = slice.map(e => cat.kind === 'keyframes' ? kfCard(e) : classCard(e)).join('');
    tocEl.innerHTML = slice.map(e => {
      const n = e.name;
      const safe = n.replace(/[^\w-]/g,'');
      const prefix = cat.kind === 'keyframes' ? 'c-kf-' : 'c-';
      return `<a href="#${prefix}${safe}">${escapeHtml(cat.kind==='keyframes'?'@'+n:'.'+n)}</a>`;
    }).join('');

    // pager
    if (pages > 1){
      const btns = [];
      btns.push(`<button ${currentPage===1?'disabled':''} data-p="prev">‹ Prev</button>`);
      const windowSize = 7;
      let s = Math.max(1, currentPage - Math.floor(windowSize/2));
      let e = Math.min(pages, s + windowSize -1);
      s = Math.max(1, e - windowSize +1);
      if (s>1) btns.push(`<button data-p="1">1</button>`) && (s>2 && btns.push(`<span class="stat">…</span>`));
      for (let i=s;i<=e;i++) btns.push(`<button class="${i===currentPage?'active':''}" data-p="${i}">${i}</button>`);
      if (e<pages){ if (e<pages-1) btns.push(`<span class="stat">…</span>`); btns.push(`<button data-p="${pages}">${pages}</button>`); }
      btns.push(`<button ${currentPage===pages?'disabled':''} data-p="next">Next ›</button>`);
      pagerEl.innerHTML = btns.join('');
      pagerEl.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
        const v = b.dataset.p;
        if (v==='prev') currentPage=Math.max(1,currentPage-1);
        else if (v==='next') currentPage=Math.min(pages,currentPage+1);
        else currentPage = +v;
        render();
        window.scrollTo({top:0,behavior:'smooth'});
      }));
    } else pagerEl.innerHTML='';

    // copy buttons
    contentEl.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',()=>copy(b.dataset.copy)));
    contentEl.querySelectorAll('[data-copy-html]').forEach(b=>b.addEventListener('click',()=>copy(b.dataset.copyHtml)));
  }

  function copy(text){
    navigator.clipboard.writeText(text).then(()=>{
      toastEl.textContent = 'Copied: '+text.slice(0,60);
      toastEl.classList.add('show');
      setTimeout(()=>toastEl.classList.remove('show'), 1200);
    });
  }

  // Search
  let searchTimer;
  searchEl.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(()=>{
      filter = searchEl.value.trim();
      currentPage = 1;
      // When searching, switch to All classes for broader results
      if (filter && activeCatIdx !== 0){ activeCatIdx = 0; renderCatList(); }
      render();
    }, 120);
  });

  // Theme toggle
  const themeBtn = document.getElementById('theme-toggle');
  function applyTheme(t){
    document.documentElement.classList.toggle('dark', t==='dark');
    try{localStorage.setItem('iconic-doc-theme', t);}catch(e){}
  }
  let savedTheme = 'light';
  try{savedTheme = localStorage.getItem('iconic-doc-theme') || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}catch(e){}
  applyTheme(savedTheme);
  themeBtn.addEventListener('click',()=>applyTheme(document.documentElement.classList.contains('dark')?'light':'dark'));

  // Sidebar toggle (mobile)
  document.getElementById('menu-toggle').addEventListener('click',()=>{
    document.getElementById('sidebar').classList.toggle('open');
  });

  renderCatList();
  render();
})();
</script>
</body></html>
