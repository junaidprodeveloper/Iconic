<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Iconic Framework — Documentation</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="description" content="Complete auto-generated documentation for the Iconic CSS framework: every class, utility, animation, and helper."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Merriweather:wght@400;700&family=Playfair+Display:wght@700;900&family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="iconic-framework.css"/>
<style>
::selection{color:#333;background:#d76b00}
:root{
  --bg:#faf5ee; --text:#333; --muted:#6b6357; --panel:#fff; --panel-2:#f3ead9;
  --line:#333; --accent:#280341; --accent-2:#d76b00; --radius:12px;
  --header-h:64px; --sidebar-w:280px; --toc-w:230px;
  --code-bg:#111; --code-fg:#f2f2f2;
  --font-body:"Merriweather",Georgia,serif;
  --font-ui:"Ubuntu",system-ui,sans-serif;
  --font-head:"Playfair Display",serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
html.dark{
  --bg:#1a1410; --text:#ece3d3; --muted:#a89f8f; --panel:#241d18; --panel-2:#2c241d;
  --line:#3a3129; --accent:#c8a2ff; --accent-2:#ffab5c; --code-bg:#0b0b0b; --code-fg:#f2f2f2;
}
*,*:before,*:after{box-sizing:border-box}
html,body.doc-body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-body);scroll-behavior:smooth;overflow-x:hidden}
body.doc-body{font-size:15px;line-height:1.65}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer}

/* Header */
.doc-header{position:sticky;top:0;z-index:60;height:var(--header-h);display:flex;align-items:center;gap:14px;padding:0 20px;
  background:rgba(255,255,255,.65);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);font-family:var(--font-ui)}
html.dark .doc-header{background:rgba(26,20,16,.75)}
.doc-header .brand{font-family:var(--font-head);font-weight:900;font-size:22px;letter-spacing:.5px;color:var(--accent)}
.doc-header .brand em{font-style:normal;color:var(--accent-2)}
.doc-header .search{flex:1;max-width:560px;position:relative}
.doc-header .search input{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:8px;
  background:var(--panel);color:var(--text);font:inherit;outline:none}
.doc-header .search input:focus{border-color:var(--accent-2)}
.doc-header .search .kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-family:var(--font-mono);
  font-size:11px;color:var(--muted);border:1px solid var(--line);padding:2px 6px;border-radius:4px;background:var(--panel-2)}
.doc-header .actions{display:flex;gap:8px}
.doc-header .icon-btn{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 12px;font-size:13px}
.doc-header .icon-btn:hover{background:var(--panel-2)}
.menu-toggle{display:none}
@media(max-width:900px){.menu-toggle{display:inline-flex}.doc-header .brand{font-size:18px}}

/* Layout */
.doc-layout{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr) var(--toc-w);min-height:calc(100vh - var(--header-h))}
@media(max-width:1200px){.doc-layout{grid-template-columns:var(--sidebar-w) minmax(0,1fr)}.doc-toc{display:none}}
@media(max-width:900px){.doc-layout{grid-template-columns:minmax(0,1fr)}
  .doc-sidebar{position:fixed;left:0;top:var(--header-h);bottom:0;width:280px;transform:translateX(-100%);
    transition:transform .2s;z-index:50;box-shadow:0 10px 40px rgba(0,0,0,.25)}
  .doc-sidebar.open{transform:translateX(0)}}

/* Sidebar */
.doc-sidebar{background:var(--panel);border-right:1px solid var(--line);position:sticky;top:var(--header-h);
  align-self:start;height:calc(100vh - var(--header-h));overflow:auto;padding:20px 10px;font-family:var(--font-ui)}
.doc-sidebar h4{font-family:var(--font-head);font-size:12px;text-transform:uppercase;letter-spacing:.14em;
  color:var(--muted);margin:16px 14px 8px;font-weight:700}
.cat-list{display:flex;flex-direction:column;gap:2px}
.cat-list button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;
  padding:8px 14px;border-radius:6px;border:none;background:transparent;color:var(--text);font-size:13.5px;font-family:inherit}
.cat-list button:hover{background:var(--panel-2)}
.cat-list button.active{background:var(--accent);color:#fff;font-weight:700}
.cat-list .count{font-size:11px;color:var(--muted);font-family:var(--font-mono)}
.cat-list button.active .count{color:#fff;opacity:.85}

/* Main */
.doc-main{padding:32px 40px 60px;min-width:0}
@media(max-width:700px){.doc-main{padding:22px 16px 40px}}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:14px;font-family:var(--font-ui)}
.crumbs a{color:var(--muted)}
.crumbs .sep{margin:0 6px}
.doc-main h1.page-title{font-family:var(--font-head);font-size:44px;font-weight:900;margin:0 0 8px;color:var(--accent);letter-spacing:-.5px}
.doc-main .lede{color:var(--muted);margin:0 0 18px;font-size:16px;max-width:70ch}
.stat-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px;font-family:var(--font-ui)}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:12.5px;color:var(--muted)}
.stat b{color:var(--text);font-weight:700;font-family:var(--font-mono)}

.section-intro{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:22px}
.section-intro h2{font-family:var(--font-head);font-weight:900;margin:0 0 6px;font-size:28px;color:var(--accent)}
.section-intro p{margin:0;color:var(--muted)}

/* Card */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px}
.card header.card-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
.card h3.class-name{margin:0;font-family:var(--font-mono);font-size:16px;font-weight:700;color:var(--accent);word-break:break-all}
.card .btns{display:flex;gap:6px;flex-wrap:wrap;font-family:var(--font-ui)}
.card .btns button{background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:5px 10px;font-size:12px}
.card .btns button:hover{background:var(--accent);color:#fff}
.card p.desc{margin:0 0 10px;color:var(--muted);font-size:14px}
.card .label{font-family:var(--font-ui);font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:14px 0 6px}
.card .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:800px){.card .grid2{grid-template-columns:1fr}}

/* Live preview like given design */
.card .preview{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:20px;min-height:80px;
  display:flex;align-items:center;justify-content:center;overflow:auto}
.card .preview .demo-inline{display:inline-block}

/* Code block — Monaco / VS Code dark */
.card pre.code{margin:0;padding:14px 16px;background:var(--code-bg);color:var(--code-fg);border-radius:10px;
  border:1px solid #000;overflow:auto;font-family:var(--font-mono);font-size:12.5px;line-height:1.6;position:relative}
.card pre.code code{display:block;white-space:pre;font-family:inherit}
.tag{color:#569cd6}
.attr{color:#9cdcfe}
.string{color:#ce9178}
.txt{color:#d4d4d4}
.comment{color:#6a9955;font-style:italic}
.selector{color:#d7ba7d}
.prop{color:#9cdcfe}
.value{color:#ce9178}

.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;font-family:var(--font-ui)}
.chip{font-size:11px;padding:3px 8px;border-radius:20px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted)}
.chip.hi{background:var(--accent);color:#fff;border-color:var(--accent)}

/* TOC */
.doc-toc{border-left:1px solid var(--line);position:sticky;top:var(--header-h);align-self:start;
  height:calc(100vh - var(--header-h));overflow:auto;padding:22px 16px;font-size:13px;font-family:var(--font-ui)}
.doc-toc h5{margin:0 0 10px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-family:var(--font-head);font-weight:700}
.doc-toc a{display:block;padding:4px 8px;border-radius:4px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:2px solid transparent}
.doc-toc a:hover{background:var(--panel-2);text-decoration:none}
.doc-toc a.active{border-left-color:var(--accent-2);color:var(--accent);font-weight:700}

/* Pager, toast */
.pager{display:flex;gap:6px;justify-content:center;margin:22px 0 6px;flex-wrap:wrap;font-family:var(--font-ui)}
.pager button{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:6px 12px;font-size:13px}
.pager button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.pager button:disabled{opacity:.4;cursor:not-allowed}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;
  padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:200;font-family:var(--font-ui)}
.toast.show{opacity:1}
.loading{padding:60px;text-align:center;color:var(--muted);font-family:var(--font-ui)}
.spinner{display:inline-block;width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;vertical-align:middle;margin-right:10px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{color:var(--muted);padding:40px;text-align:center;border:1px dashed var(--line);border-radius:12px;font-family:var(--font-ui)}
</style>
</head>
<body class="doc-body">

<header class="doc-header">
  <button class="icon-btn menu-toggle" id="menuToggle" aria-label="Menu">☰</button>
  <div class="brand">Iconic<em>.</em>Framework</div>
  <div class="search">
    <input id="search" type="search" placeholder="Search classes, utilities, animations…" autocomplete="off"/>
    <span class="kbd">/</span>
  </div>
  <div class="actions">
    <button class="icon-btn" id="themeBtn" title="Toggle theme">◐</button>
    <a class="icon-btn" href="iconic-framework.css" download>CSS</a>
  </div>
</header>

<div class="doc-layout">
  <aside class="doc-sidebar" id="sidebar">
    <h4>Categories</h4>
    <div class="cat-list" id="catList"><div class="loading"><span class="spinner"></span>Loading…</div></div>
  </aside>

  <main class="doc-main" id="main">
    <nav class="crumbs" id="crumbs"><a href="#">Docs</a></nav>
    <h1 class="page-title" id="pageTitle">Iconic Framework</h1>
    <p class="lede" id="pageLede">A modern, comprehensive CSS framework with thousands of utilities, components, helpers, and animations — all documented automatically from the source stylesheet.</p>
    <div class="stat-row" id="stats"></div>
    <div id="content"><div class="loading"><span class="spinner"></span>Parsing iconic-framework.css…</div></div>
    <div class="pager" id="pager"></div>
  </main>

  <aside class="doc-toc" id="toc">
    <h5>On this page</h5>
    <div id="tocList"></div>
  </aside>
</div>

<div class="toast" id="toast">Copied!</div>

<script>
(function(){
'use strict';

const $ = (id)=>document.getElementById(id);
const state = { rules:[], byCat:{}, cats:[], current:null, page:1, perPage:40, query:'', filtered:null };

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1400); }
function copy(text){ navigator.clipboard.writeText(text).then(()=>toast('Copied: '+text.slice(0,40))); }

// ===== Categorization =====
const CATEGORY_DEFS = [
  {id:'getting-started', name:'Getting Started', desc:'Install and use Iconic in your project.'},
  {id:'typography', name:'Typography', desc:'Fonts, sizes, weights, alignment, letter spacing.', test:(s,d)=>/^ic-(font|text|serif|sans|mono|italic|bold|thin|light|regular|medium|semibold|black|underline|uppercase|lowercase|capitalize|leading|tracking|antialiased)/.test(s) || /font-family|font-size|font-weight|letter-spacing|line-height|text-align|text-decoration|text-transform/.test(d)},
  {id:'colors',       name:'Colors',       desc:'Text and border colors.',       test:(s,d)=>/^ic-(text|color|border-color)-/.test(s) || (/color:/.test(d) && !/background/.test(d))},
  {id:'backgrounds',  name:'Backgrounds',  desc:'Background colors, gradients, patterns.', test:(s,d)=>/^ic-(bg|background|gradient)/.test(s) || /background(-color)?:/.test(d)},
  {id:'spacing',      name:'Spacing',      desc:'Margin and padding utilities.',  test:(s,d)=>/^ic-(m|p|mx|my|mt|mr|mb|ml|px|py|pt|pr|pb|pl|gap|space)-/.test(s) || /(margin|padding|gap):/.test(d)},
  {id:'sizing',       name:'Sizing',       desc:'Width, height, min/max dimensions.', test:(s,d)=>/^ic-(w|h|min-w|max-w|min-h|max-h|size)-/.test(s) || /^(width|height|min-|max-)/.test(d)},
  {id:'layout',       name:'Layout',       desc:'Display, position, overflow, z-index.', test:(s,d)=>/^ic-(block|inline|hidden|absolute|relative|fixed|sticky|static|overflow|z-|visible|invisible|float|clear|isolate)/.test(s) || /display:|position:|overflow:|z-index:/.test(d)},
  {id:'flexbox',      name:'Flexbox',      desc:'Flex layouts, direction, wrap, alignment.', test:(s,d)=>/^ic-(flex|justify|items|self|content|order|grow|shrink|basis)/.test(s) || /flex|justify-content|align-/.test(d)},
  {id:'grid',         name:'Grid',         desc:'CSS grid columns, rows, gaps.', test:(s,d)=>/^ic-grid|^ic-col-|^ic-row-/.test(s) || /grid-|grid:/.test(d)},
  {id:'borders',      name:'Borders',      desc:'Border widths, styles and radius.', test:(s,d)=>/^ic-(border|rounded|ring|outline)/.test(s) || /border(-\w+)?:|border-radius/.test(d)},
  {id:'shadows',      name:'Shadows & Effects', desc:'Box shadows, opacity, blend modes.', test:(s,d)=>/^ic-(shadow|opacity|mix-blend|blend)/.test(s) || /box-shadow|opacity:/.test(d)},
  {id:'filters',      name:'Filters',      desc:'Blur, brightness, contrast, saturation.', test:(s,d)=>/^ic-(blur|brightness|contrast|saturate|grayscale|sepia|invert|hue-rotate|drop-shadow|backdrop)/.test(s) || /filter:|backdrop-filter/.test(d)},
  {id:'transforms',   name:'Transforms',   desc:'Scale, rotate, translate, skew.', test:(s,d)=>/^ic-(scale|rotate|translate|skew|transform|origin)/.test(s) || /transform:/.test(d)},
  {id:'transitions',  name:'Transitions',  desc:'Duration, timing, delay, transitions.', test:(s,d)=>/^ic-(transition|duration|ease|delay|will-change)/.test(s) || /transition|animation-/.test(d)},
  {id:'animations',   name:'Animations',   desc:'Keyframe-based motion utilities.', test:(s,d)=>/^ic-(animate|anim-|bounce|pulse|spin|fade|slide|zoom)/.test(s) || /animation:/.test(d)},
  {id:'keyframes',    name:'Keyframes',    desc:'@keyframes definitions.', kf:true},
  {id:'buttons',      name:'Buttons',      desc:'Button styles and sizes.', test:(s)=>/^ic-btn|^ic-button/.test(s)},
  {id:'forms',        name:'Forms',        desc:'Inputs, selects, textareas, checks.', test:(s)=>/^ic-(input|form|field|select|textarea|check|radio|switch|label)/.test(s)},
  {id:'tables',       name:'Tables',       desc:'Table styles and modifiers.', test:(s)=>/^ic-(table|tr|td|th)/.test(s)},
  {id:'cards',        name:'Cards',        desc:'Card containers and modifiers.', test:(s)=>/^ic-card/.test(s)},
  {id:'alerts',       name:'Alerts & Badges', desc:'Alerts, badges, tags, pills.', test:(s)=>/^ic-(alert|badge|tag|pill|chip|notice|toast|banner)/.test(s)},
  {id:'nav',          name:'Navigation',   desc:'Navbars, menus, breadcrumbs, tabs.', test:(s)=>/^ic-(nav|menu|breadcrumb|tab|pagination|sidebar)/.test(s)},
  {id:'modal',        name:'Modals & Overlays', desc:'Dialogs, drawers, tooltips.', test:(s)=>/^ic-(modal|dialog|drawer|tooltip|popover|overlay|backdrop)/.test(s)},
  {id:'icons',        name:'Icons',        desc:'Icon glyph classes.', test:(s)=>/^ic-icon|^ic-i-/.test(s)},
  {id:'accessibility',name:'Accessibility',desc:'Screen-reader and focus utilities.', test:(s,d)=>/^ic-(sr|not-sr|focus)/.test(s) || /screen-reader/.test(d)},
  {id:'responsive',   name:'Responsive',   desc:'Breakpoint-prefixed utilities.', test:(s)=>/^ic-(sm|md|lg|xl|xxl|2xl):/.test(s) || /^ic-.+@/.test(s)},
  {id:'variables',    name:'CSS Variables',desc:'Custom properties defined by the framework.', vars:true},
  {id:'other',        name:'Other Utilities', desc:'Additional helpers and utilities.'},
];

function categorize(sel, decl){
  for(const c of CATEGORY_DEFS){
    if(c.test && c.test(sel, decl||'')) return c.id;
  }
  return 'other';
}

// ===== CSS parsing =====
function stripComments(css){ return css.replace(/\/\*[\s\S]*?\*\//g,''); }

function parseCss(css){
  css = stripComments(css);
  const rules = [];
  const keyframes = [];
  const vars = [];
  let i=0, len=css.length;

  while(i<len){
    // skip @import & similar top-level @rules that end with ;
    while(i<len && /\s/.test(css[i])) i++;
    if(i>=len) break;

    if(css[i]==='@'){
      // find name
      const semi = css.indexOf(';', i);
      const brace = css.indexOf('{', i);
      if(brace===-1 || (semi!==-1 && semi<brace)){
        i = semi===-1?len:semi+1; continue;
      }
      const name = css.slice(i, brace).trim();
      // find matching close
      let depth=1, j=brace+1;
      while(j<len && depth>0){
        if(css[j]==='{') depth++;
        else if(css[j]==='}') depth--;
        j++;
      }
      const inner = css.slice(brace+1, j-1);
      if(/^@keyframes/i.test(name) || /^@-\w+-keyframes/i.test(name)){
        const kfName = name.replace(/^@[-\w]*keyframes\s+/i,'').trim();
        keyframes.push({name:kfName, body:inner.trim()});
      } else if(/^@media/i.test(name) || /^@supports/i.test(name)){
        // parse inner rules and tag with media
        const inRules = parseRuleBlock(inner);
        inRules.forEach(r=>{ r.media = name; rules.push(r); });
      }
      i = j;
      continue;
    }

    // regular rule: selector { decl }
    const brace = css.indexOf('{', i);
    if(brace===-1) break;
    const sel = css.slice(i, brace).trim();
    let depth=1, j=brace+1;
    while(j<len && depth>0){
      if(css[j]==='{') depth++;
      else if(css[j]==='}') depth--;
      j++;
    }
    const decl = css.slice(brace+1, j-1).trim();
    if(sel===':root' || sel==='html' || /^html/.test(sel)){
      decl.split(';').forEach(d=>{
        const t=d.trim();
        const m=t.match(/^(--[\w-]+)\s*:\s*(.+)$/);
        if(m) vars.push({name:m[1], value:m[2].trim(), context:sel});
      });
    }
    // split selector list
    sel.split(',').forEach(s=>{
      const trimmed = s.trim();
      if(trimmed) rules.push({selector:trimmed, decl});
    });
    i = j;
  }
  return {rules, keyframes, vars};
}

function parseRuleBlock(css){
  const out=[];
  let i=0, len=css.length;
  while(i<len){
    while(i<len && /\s/.test(css[i])) i++;
    if(i>=len) break;
    const brace = css.indexOf('{', i);
    if(brace===-1) break;
    const sel = css.slice(i, brace).trim();
    let depth=1, j=brace+1;
    while(j<len && depth>0){
      if(css[j]==='{') depth++;
      else if(css[j]==='}') depth--;
      j++;
    }
    const decl = css.slice(brace+1, j-1).trim();
    sel.split(',').forEach(s=>{ const t=s.trim(); if(t) out.push({selector:t, decl}); });
    i=j;
  }
  return out;
}

// ===== Rendering helpers =====
function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }

function highlightHtml(html){
  // syntax-highlight an HTML snippet with VSCode colors
  return escapeHtml(html)
    .replace(/(&lt;\/?)([\w-]+)/g, '<span class="txt">$1</span><span class="tag">$2</span>')
    .replace(/([\w-]+)(=)(&quot;[^&]*?&quot;)/g, '<span class="attr">$1</span><span class="txt">$2</span><span class="string">$3</span>')
    .replace(/(&gt;)/g, '<span class="txt">$1</span>');
}
function highlightCss(css){
  return escapeHtml(css)
    .replace(/(\/\*[\s\S]*?\*\/)/g,'<span class="comment">$1</span>')
    .replace(/^([^\{]+)\{/gm,'<span class="selector">$1</span>{')
    .replace(/([\w-]+)(\s*:\s*)([^;]+)(;)/g,'<span class="prop">$1</span>$2<span class="value">$3</span>$4');
}

function classFromSelector(sel){
  const m = sel.match(/\.([a-zA-Z_][\w-]*)/);
  return m?m[1]:null;
}

// Build a friendly demo HTML for a class
function buildDemo(cls, decl){
  const d = decl||'';
  // buttons
  if(/^ic-btn|^ic-button/.test(cls)) return `<button class="${cls}">Button</button>`;
  // inputs
  if(/^ic-input|^ic-field|^ic-select/.test(cls)) return `<input class="${cls}" placeholder="Type here"/>`;
  if(/^ic-textarea/.test(cls)) return `<textarea class="${cls}" rows="2">Textarea</textarea>`;
  if(/^ic-check|^ic-radio|^ic-switch/.test(cls)) return `<label><input type="checkbox" class="${cls}"/> Option</label>`;
  // table
  if(/^ic-table/.test(cls)) return `<table class="${cls}"><thead><tr><th>A</th><th>B</th></tr></thead><tbody><tr><td>1</td><td>2</td></tr></tbody></table>`;
  // card
  if(/^ic-card/.test(cls)) return `<div class="${cls}" style="padding:14px;max-width:280px">Card content</div>`;
  // alerts/badges
  if(/^ic-(alert|badge|tag|pill|chip|notice|toast|banner)/.test(cls)) return `<span class="${cls}">${cls.replace(/^ic-/,'')}</span>`;
  // typography
  if(/^ic-(font|text|serif|sans|mono|italic|bold|thin|light|regular|medium|semibold|black|uppercase|lowercase|capitalize|leading|tracking)/.test(cls)) return `<p class="${cls}" style="margin:0">The quick brown fox jumps over the lazy dog.</p>`;
  // colors / bg
  if(/^ic-bg/.test(cls)) return `<div class="${cls}" style="width:180px;height:64px;border-radius:8px;border:1px solid rgba(0,0,0,.1)"></div>`;
  if(/^ic-(text|color)-/.test(cls) && !/background/.test(d)) return `<span class="${cls}" style="font-weight:700">Colored text</span>`;
  if(/^ic-border/.test(cls)) return `<div class="${cls}" style="padding:14px;width:180px;background:#fff">Border</div>`;
  if(/^ic-rounded/.test(cls)) return `<div class="${cls}" style="width:120px;height:60px;background:#280341"></div>`;
  if(/^ic-shadow/.test(cls)) return `<div class="${cls}" style="width:140px;height:70px;background:#fff;border-radius:8px"></div>`;
  // sizing / spacing
  if(/^ic-(w|h|min-w|max-w|min-h|max-h)-/.test(cls)) return `<div class="${cls}" style="background:#280341;color:#fff;padding:8px">${cls}</div>`;
  if(/^ic-(m|p|mx|my|mt|mr|mb|ml|px|py|pt|pr|pb|pl)-/.test(cls)) return `<div style="background:#eee;display:inline-block"><div class="${cls}" style="background:#280341;color:#fff">Box</div></div>`;
  if(/^ic-gap-|^ic-space-/.test(cls)) return `<div class="ic-flex ${cls}" style="display:flex"><div style="padding:8px;background:#280341;color:#fff">A</div><div style="padding:8px;background:#280341;color:#fff">B</div></div>`;
  // flex/grid
  if(/^ic-flex|^ic-justify|^ic-items|^ic-content/.test(cls)) return `<div class="${cls}" style="display:flex;background:#f3ead9;padding:8px;gap:6px"><span style="padding:6px 10px;background:#280341;color:#fff">1</span><span style="padding:6px 10px;background:#280341;color:#fff">2</span><span style="padding:6px 10px;background:#280341;color:#fff">3</span></div>`;
  if(/^ic-grid|^ic-col-|^ic-row-/.test(cls)) return `<div class="${cls}" style="display:grid;gap:6px;background:#f3ead9;padding:8px"><div style="padding:8px;background:#280341;color:#fff">A</div><div style="padding:8px;background:#280341;color:#fff">B</div></div>`;
  // transforms/animations
  if(/^ic-(scale|rotate|translate|skew|animate|anim-|bounce|pulse|spin|fade|slide|zoom)/.test(cls)) return `<div class="${cls}" style="width:80px;height:80px;background:#280341;border-radius:12px"></div>`;
  // filters
  if(/^ic-(blur|brightness|contrast|saturate|grayscale|sepia|invert|hue-rotate|opacity)/.test(cls)) return `<div class="${cls}" style="width:120px;height:80px;background:linear-gradient(135deg,#d76b00,#280341);border-radius:8px"></div>`;
  // icons
  if(/^ic-icon|^ic-i-/.test(cls)) return `<i class="${cls}" style="font-size:24px"></i>`;
  // display
  if(/^ic-(block|inline|hidden|absolute|relative|fixed|sticky|static|visible|invisible|float|overflow|z-)/.test(cls)) return `<div class="${cls}" style="background:#280341;color:#fff;padding:8px">${cls}</div>`;
  // fallback
  return `<div class="${cls}" style="padding:10px 14px;background:#f3ead9;border:1px dashed #280341;border-radius:6px">.${cls}</div>`;
}

function describe(cls, decl){
  if(!cls) return 'Custom selector.';
  const d = decl.replace(/\s+/g,' ').trim();
  if(/^ic-btn/.test(cls)) return 'Button component with padding, border, and interactive states.';
  if(/^ic-input|^ic-field/.test(cls)) return 'Form input control with consistent styling and focus states.';
  if(/^ic-card/.test(cls)) return 'Card container for grouping related content.';
  if(/^ic-alert/.test(cls)) return 'Alert message with contextual color.';
  if(/^ic-badge|^ic-tag|^ic-pill/.test(cls)) return 'Small label to highlight metadata.';
  if(/^ic-flex/.test(cls)) return 'Flexbox layout utility.';
  if(/^ic-grid/.test(cls)) return 'Grid layout utility.';
  if(/^ic-(m|p|mx|my|mt|mr|mb|ml|px|py|pt|pr|pb|pl)-/.test(cls)) return 'Spacing utility ('+(cls[3]==='m'?'margin':'padding')+').';
  if(/^ic-(w|h|min-w|max-w|min-h|max-h)-/.test(cls)) return 'Sizing utility for width/height.';
  if(/^ic-bg/.test(cls)) return 'Background color / image utility.';
  if(/^ic-text-/.test(cls)) return 'Text color or typography utility.';
  if(/^ic-font-/.test(cls)) return 'Font family or weight utility.';
  if(/^ic-border/.test(cls)) return 'Border utility.';
  if(/^ic-rounded/.test(cls)) return 'Border-radius utility.';
  if(/^ic-shadow/.test(cls)) return 'Box-shadow utility.';
  if(/^ic-(scale|rotate|translate|skew|transform)/.test(cls)) return 'CSS transform utility.';
  if(/^ic-(animate|anim-|bounce|pulse|spin|fade|slide|zoom)/.test(cls)) return 'Animation utility using keyframes.';
  if(/^ic-(blur|brightness|contrast|saturate|grayscale|sepia|invert|hue-rotate)/.test(cls)) return 'CSS filter utility.';
  if(/^ic-icon|^ic-i-/.test(cls)) return 'Iconic glyph — inline icon.';
  // Fallback: use first declaration
  const first = d.split(';')[0];
  return first ? 'Applies: '+first : 'Utility class.';
}

function renderCard(r, idx){
  const cls = classFromSelector(r.selector) || r.selector;
  const demo = buildDemo(cls, r.decl);
  const desc = describe(cls, r.decl);
  const htmlSnippet = demo;
  const cssSnippet = r.selector+' {\n  '+r.decl.split(';').map(s=>s.trim()).filter(Boolean).join(';\n  ')+';\n}';
  const id = 'card-'+idx+'-'+cls.replace(/[^\w]/g,'-');
  return `<article class="card" id="${id}">
    <header class="card-head">
      <h3 class="class-name">.${escapeHtml(cls)}</h3>
      <div class="btns">
        <button data-copy="${escapeHtml(cls)}">Copy class</button>
        <button data-copy-html="${escapeHtml(htmlSnippet)}">Copy HTML</button>
      </div>
    </header>
    <p class="desc">${escapeHtml(desc)}</p>
    <div class="grid2">
      <div>
        <div class="label">Live Preview</div>
        <div class="preview"><div class="demo-inline">${demo}</div></div>
      </div>
      <div>
        <div class="label">HTML</div>
        <pre class="code"><code>${highlightHtml(htmlSnippet)}</code></pre>
      </div>
    </div>
    <div class="label">CSS</div>
    <pre class="code"><code>${highlightCss(cssSnippet)}</code></pre>
    ${r.media?`<div class="meta"><span class="chip hi">${escapeHtml(r.media)}</span></div>`:''}
  </article>`;
}

function renderKeyframe(kf, idx){
  const cssSnippet = '@keyframes '+kf.name+' {\n  '+kf.body.replace(/\s+/g,' ').trim()+'\n}';
  const demo = `<div style="width:70px;height:70px;background:#280341;border-radius:12px;animation:${kf.name} 2s ease-in-out infinite"></div>`;
  return `<article class="card" id="kf-${idx}">
    <header class="card-head">
      <h3 class="class-name">@keyframes ${escapeHtml(kf.name)}</h3>
      <div class="btns"><button data-copy="${escapeHtml(kf.name)}">Copy name</button></div>
    </header>
    <p class="desc">Keyframe animation. Apply via <code>animation: ${escapeHtml(kf.name)} 2s ease-in-out infinite;</code></p>
    <div class="grid2">
      <div><div class="label">Live Preview</div><div class="preview">${demo}</div></div>
      <div><div class="label">CSS</div><pre class="code"><code>${highlightCss(cssSnippet)}</code></pre></div>
    </div>
  </article>`;
}

function renderVariable(v, idx){
  const cssSnippet = v.context+' {\n  '+v.name+': '+v.value+';\n}';
  const usage = 'color: var('+v.name+');';
  return `<article class="card" id="var-${idx}">
    <header class="card-head">
      <h3 class="class-name">${escapeHtml(v.name)}</h3>
      <div class="btns"><button data-copy="${escapeHtml(v.name)}">Copy name</button><button data-copy="var(${escapeHtml(v.name)})">Copy var()</button></div>
    </header>
    <p class="desc">CSS custom property. Value: <code>${escapeHtml(v.value)}</code></p>
    <div class="label">Usage</div>
    <pre class="code"><code>${highlightCss(usage)}</code></pre>
    <div class="label">Definition</div>
    <pre class="code"><code>${highlightCss(cssSnippet)}</code></pre>
  </article>`;
}

// ===== App =====
function group(data){
  const {rules, keyframes, vars} = data;
  const byCat = {};
  CATEGORY_DEFS.forEach(c=>byCat[c.id]=[]);

  const seen = new Set();
  rules.forEach(r=>{
    const cls = classFromSelector(r.selector);
    if(!cls) return;
    // dedupe by class name (keep first)
    if(seen.has(cls)) return;
    seen.add(cls);
    const cat = categorize(cls, r.decl);
    byCat[cat].push(r);
  });
  byCat['keyframes'] = keyframes.map(k=>({keyframe:k}));
  byCat['variables'] = vars.map(v=>({variable:v}));
  return byCat;
}

function renderSidebar(){
  const el = $('catList');
  el.innerHTML = CATEGORY_DEFS.map(c=>{
    if(c.id==='getting-started') return `<button data-cat="getting-started"><span>${c.name}</span><span class="count">·</span></button>`;
    const n = (state.byCat[c.id]||[]).length;
    if(!n && c.id!=='other') return '';
    return `<button data-cat="${c.id}"><span>${c.name}</span><span class="count">${n}</span></button>`;
  }).join('');
  el.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', ()=>{ state.current=b.dataset.cat; state.page=1; state.query=''; $('search').value=''; render(); if(window.innerWidth<=900) $('sidebar').classList.remove('open'); });
  });
}

function renderGettingStarted(){
  $('pageTitle').textContent='Getting Started';
  $('pageLede').textContent='Add Iconic Framework to any HTML page with a single stylesheet link.';
  $('crumbs').innerHTML='<a href="#">Docs</a><span class="sep">›</span> Getting Started';
  $('stats').innerHTML='';
  $('pager').innerHTML='';
  const install = `<!doctype html>\n<html>\n<head>\n  <link rel="stylesheet" href="iconic-framework.css">\n</head>\n<body>\n  <button class="ic-btn">Hello</button>\n</body>\n</html>`;
  $('content').innerHTML = `
    <div class="section-intro">
      <h2>Installation</h2>
      <p>Iconic is a plain CSS file — no build step, no dependencies.</p>
    </div>
    <article class="card">
      <header class="card-head"><h3 class="class-name">1. Link the stylesheet</h3>
        <div class="btns"><button data-copy='<link rel="stylesheet" href="iconic-framework.css">'>Copy</button></div>
      </header>
      <pre class="code"><code>${highlightHtml('<link rel="stylesheet" href="iconic-framework.css">')}</code></pre>
    </article>
    <article class="card">
      <header class="card-head"><h3 class="class-name">2. Use utility classes</h3></header>
      <p class="desc">Compose designs with the ic- prefixed utilities documented in the sidebar.</p>
      <pre class="code"><code>${highlightHtml(install)}</code></pre>
    </article>
    <article class="card">
      <header class="card-head"><h3 class="class-name">3. Keyboard shortcuts</h3></header>
      <p class="desc">Press <b>/</b> to focus search. Use ↑ ↓ to move through results and Enter to jump.</p>
    </article>`;
  buildToc();
  wireCopy();
}

function paginate(items){
  const start=(state.page-1)*state.perPage;
  return items.slice(start, start+state.perPage);
}

function renderPager(total){
  const pages = Math.ceil(total/state.perPage);
  if(pages<=1){ $('pager').innerHTML=''; return; }
  const cur=state.page;
  const btns=[];
  btns.push(`<button ${cur===1?'disabled':''} data-p="${cur-1}">‹</button>`);
  const win=2;
  for(let p=1;p<=pages;p++){
    if(p===1||p===pages||(p>=cur-win&&p<=cur+win)){
      btns.push(`<button class="${p===cur?'active':''}" data-p="${p}">${p}</button>`);
    } else if(p===cur-win-1||p===cur+win+1){
      btns.push('<button disabled>…</button>');
    }
  }
  btns.push(`<button ${cur===pages?'disabled':''} data-p="${cur+1}">›</button>`);
  const el=$('pager'); el.innerHTML=btns.join('');
  el.querySelectorAll('button[data-p]').forEach(b=>b.addEventListener('click',()=>{ state.page=+b.dataset.p; render(); window.scrollTo({top:0,behavior:'smooth'}); }));
}

function buildToc(){
  const cards = document.querySelectorAll('#content .card');
  const items = Array.from(cards).slice(0,50).map(c=>{
    const h=c.querySelector('h3'); if(!h) return '';
    return `<a href="#${c.id}">${escapeHtml(h.textContent)}</a>`;
  }).join('');
  $('tocList').innerHTML = items || '<span style="color:var(--muted)">—</span>';
}

function wireCopy(){
  document.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',()=>copy(b.dataset.copy)));
  document.querySelectorAll('[data-copy-html]').forEach(b=>b.addEventListener('click',()=>copy(b.dataset.copyHtml)));
}

function render(){
  if(state.current==='getting-started' || !state.current){ renderGettingStarted(); markActive(); return; }
  const cat = CATEGORY_DEFS.find(c=>c.id===state.current);
  let items = state.byCat[state.current]||[];
  if(state.query){
    const q=state.query.toLowerCase();
    items = items.filter(x=>{
      const sel = x.keyframe?x.keyframe.name : x.variable?x.variable.name : classFromSelector(x.selector)||'';
      return sel.toLowerCase().includes(q);
    });
  }
  $('pageTitle').textContent=cat.name;
  $('pageLede').textContent=cat.desc;
  $('crumbs').innerHTML=`<a href="#">Docs</a><span class="sep">›</span> ${escapeHtml(cat.name)}`;
  $('stats').innerHTML=`<div class="stat"><b>${items.length}</b> items</div><div class="stat">Page <b>${state.page}</b></div>`;
  if(!items.length){ $('content').innerHTML='<div class="empty">No items match this filter.</div>'; $('pager').innerHTML=''; $('tocList').innerHTML=''; markActive(); return; }
  const page = paginate(items);
  const html = page.map((x,i)=>{
    if(x.keyframe) return renderKeyframe(x.keyframe, (state.page-1)*state.perPage+i);
    if(x.variable) return renderVariable(x.variable, (state.page-1)*state.perPage+i);
    return renderCard(x, (state.page-1)*state.perPage+i);
  }).join('');
  $('content').innerHTML = html;
  renderPager(items.length);
  buildToc();
  wireCopy();
  markActive();
}

function markActive(){
  document.querySelectorAll('#catList button').forEach(b=>b.classList.toggle('active', b.dataset.cat===state.current));
}

// ===== Init =====
async function load(){
  try{
    const res = await fetch('iconic-framework.css', {cache:'reload'});
    const css = await res.text();
    const data = parseCss(css);
    state.rules = data.rules;
    state.byCat = group(data);
    renderSidebar();
    state.current = 'getting-started';
    render();
    // stats
  } catch(e){
    $('content').innerHTML='<div class="empty">Failed to load iconic-framework.css: '+escapeHtml(String(e))+'</div>';
  }
}

// theme
const savedTheme = (()=>{ try{ return localStorage.getItem('iconic-theme'); }catch(e){ return null; } })();
if(savedTheme==='dark') document.documentElement.classList.add('dark');
$('themeBtn').addEventListener('click',()=>{
  document.documentElement.classList.toggle('dark');
  try{ localStorage.setItem('iconic-theme', document.documentElement.classList.contains('dark')?'dark':'light'); }catch(e){}
});

// search
let searchTimer;
$('search').addEventListener('input', e=>{
  clearTimeout(searchTimer);
  searchTimer = setTimeout(()=>{ state.query=e.target.value.trim(); state.page=1; render(); }, 120);
});
document.addEventListener('keydown', e=>{
  if(e.key==='/' && document.activeElement!==$('search')){ e.preventDefault(); $('search').focus(); }
  if(e.key==='Escape'){ $('search').value=''; state.query=''; render(); }
});

$('menuToggle').addEventListener('click',()=>$('sidebar').classList.toggle('open'));

// scroll spy for TOC
const spy = new IntersectionObserver(entries=>{
  entries.forEach(en=>{
    if(en.isIntersecting){
      const id=en.target.id;
      document.querySelectorAll('#tocList a').forEach(a=>a.classList.toggle('active', a.getAttribute('href')==='#'+id));
    }
  });
}, {rootMargin:'-40% 0px -55% 0px'});
new MutationObserver(()=>{
  document.querySelectorAll('#content .card').forEach(c=>spy.observe(c));
}).observe($('content'), {childList:true});

load();
})();
</script>
</body>
</html>
